# retroforge release INSTALLER — the recovery medium that installs RetroForge onto a device's internal
# storage. Phase 6 of .claude/plans/internal-install.plan.md.
#
# TAG NAMESPACE: `installer/v*`, its own, for the reason card/ and ota/ have theirs — three
# artifacts with three cadences. A medium is cut when the installer changes, which is neither the
# card's cadence nor the OTA's.
#
# NEEDS NO SIGNING KEY AND NO R2 CREDENTIAL, exactly like the card: the medium is flashed over USB by
# someone holding the device, so there is no signature for anything to verify, and since 2026-10-13
# it is a GitHub Release asset — 404 MiB under gz -6 (measured that day, bbde6b6), a fifth of the
# 2 GiB per-asset cap. The only credential is the release job's GITHUB_TOKEN; that job names the
# `release-cards` environment for its reviewer, as release-sdcard.yml does (its header has the why,
# and the note that the repo is private, so a download needs a GitHub login with access).
#
# THE MEDIUM IS NOT PINNED TO AN OS BUNDLE. It resolves <channel>/latest.json at install time, so
# any medium installs the current release — which is why there is no bundle input here and why an
# old medium never installs an old OS.
name: release installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for this medium, with its v (e.g. v0.0.3 -> tag installer/v0.0.3; default: v<date>.<shortsha>)'
        required: false
        type: string
        default: ''
      publish:
        description: 'Cut a GitHub Release carrying the medium (off for a plain test build)'
        required: false
        type: boolean
        default: false
  push:
    tags:
      - 'installer/v*'

permissions:
  contents: read

jobs:
  prep:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_VERSION:-}" ]; then
            v="$INPUT_VERSION"
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            v="${REF_NAME#installer/}"
          else
            # A DOT, not a dash: the pre-release check below refuses any `-`, so `date-sha` failed
            # every such dispatch. The leading `v` matches what a tag run yields, since
            # `installer/` is all it strips.
            v="v$(date -u +%Y%m%d).$(echo "$GITHUB_SHA" | cut -c1-7)"
          fi
          case "$v" in
            *[!A-Za-z0-9._-]*) echo "::error::version '$v' has characters that do not belong in a URL path"; exit 1 ;;
          esac
          # NO PRE-RELEASE MEDIA, for the reason release-sdcard.yml refuses them: release-bundle.yml
          # reads a semver pre-release suffix as "publish to the beta channel", so the suffix now
          # means something a medium cannot deliver. A medium is not pinned to a bundle at all — it
          # resolves <channel>/latest.json at install time and a release one resolves `stable`
          # (asserted in installer/verify-image.sh) — so `installer/v0.0.2-beta.1` would install
          # exactly what `installer/v0.0.2` installs, while reading as though it had installed a
          # beta. Refuse the tag rather than ship that ambiguity.
          case "$v" in
            *-*) echo "::error::version '$v' carries a pre-release suffix, which on an ota/ tag selects the beta channel. A medium installs the latest STABLE release whatever its own version says, so the suffix would be a lie. Tag the installer without it."; exit 1 ;;
          esac
          if [ "$GITHUB_REF_TYPE" = tag ] || [ "${INPUT_PUBLISH:-false}" = true ]; then
            p=true
          else
            p=false
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "publish=$p" >> "$GITHUB_OUTPUT"
          echo "version=$v publish=$p" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: prep
    uses: ./.github/workflows/image.yml
    with:
      artifact: installer
      version: ${{ needs.prep.outputs.version }}
      # No environment: nothing in an installer build is signed, so the long job — bootstrapping a
      # second rootfs and compiling the overlay from third-party sources as uid 0 — holds no
      # credential at all. It ends at a workflow artifact, exactly as the card build does.
      environment: ''

  # The publish half: the medium, its checksums and its provenance, as one GitHub Release — the same
  # shape as release-sdcard.yml's release job, whose comments carry the reasoning (reviewer gate on a
  # finished build, `contents: write` scoped here, retry without a rebuild).
  #
  # A dispatch with publish:true creates the `installer/<version>` tag itself, on the commit that was
  # built — the exact inverse of prep stripping `installer/` from a tag, so a dispatch of `v0.0.3`
  # and a push of `installer/v0.0.3` produce the same tag and the same version in the medium.
  release:
    needs: [prep, build]
    if: needs.prep.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # For the reviewer, not for secrets: the same environment the card's release job names.
    environment: ${{ vars.CARDS_ENVIRONMENT || 'release-cards' }}
    steps:
      - name: fetch the medium
        uses: actions/download-artifact@v8
        with:
          name: retroforge-installer
          path: upload

      - name: fetch the metadata
        uses: actions/download-artifact@v8
        with:
          name: retroforge-installer-meta
          path: meta

      - name: check the medium fits a release asset
        run: |
          set -euo pipefail
          size="$(stat -c %s upload/installer.img.gz)"
          limit=$((2 * 1024 * 1024 * 1024))
          echo "medium: $((size / 1048576)) MiB of a $((limit / 1048576)) MiB asset cap" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$size" -ge "$limit" ]; then
            echo "::error::installer.img.gz is $size bytes, over GitHub's 2 GiB per-asset cap. The medium has to shrink, or move to a host without the cap."
            exit 1
          fi

      # A TAG THAT ALREADY EXISTS MUST BE THIS COMMIT: when it exists the release API uses it as-is
      # and ignores --target. See release-sdcard.yml for why the lookup is shaped this way.
      - name: cut the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prep.outputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="installer/$VERSION"
          fi
          exists="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$tag" \
            --jq "map(select(.ref == \"refs/tags/$tag\")) | length")"
          if [ "$exists" != 0 ]; then
            at="$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/$tag" --jq .sha)"
            if [ "$at" != "$GITHUB_SHA" ]; then
              echo "::error::tag $tag already exists on $at, but this medium was built from $GITHUB_SHA. Pick a new version, or run from the tag itself."
              exit 1
            fi
          fi
          {
            echo "## retroforge installer \`$VERSION\`"
            echo
            echo 'Writes RetroForge to a device'"'"'s internal storage, alongside Android. Flash it to'
            echo 'an SD card, boot the device from it, and follow the screens.'
            echo
            echo '```bash'
            echo "gh release download '$tag' -R '$GITHUB_REPOSITORY' -p installer.img.gz -p sha256sums.txt"
            echo 'sha256sum -c sha256sums.txt   # BEFORE writing the image to a card'
            echo 'gzip -dc installer.img.gz | sudo dd of=/dev/sdX bs=4M conv=fsync status=progress'
            echo '```'
            echo
            echo '**Before you boot it:** the medium'"'"'s first partition is a plain FAT volume that'
            echo 'Windows and macOS both show. Copy `retroforge/wifi.conf.example` to'
            echo '`retroforge/wifi.conf` and put your network name and password in it — the installer'
            echo 'downloads RetroForge over the network and has no way to ask you for them. A USB-C'
            echo 'Ethernet adapter needs no file at all. If an install fails, that same partition is'
            echo 'where `retroforge-install.log` comes out.'
            echo
            echo '**What it destroys:** Android'"'"'s user data on the target device. Android itself'
            echo 'still boots, factory-reset, with the space you choose on screen. The installer'
            echo 'says all of this and takes a per-run button sequence as consent before it writes.'
            echo
            echo "This medium installs the current OS release from the update channel — it is not"
            echo "pinned to one; the OS itself is the only download during an install."
          } > notes.md
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "retroforge installer $VERSION" \
            --notes-file notes.md \
            upload/installer.img.gz meta/sha256sums.txt meta/provenance/manifest.lock
