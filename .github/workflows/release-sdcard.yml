# retroforge release SD card — a flashable image for bringing a device up from scratch.
#
# Separate from release-bundle.yml because the two are wanted at different cadences: a card is what
# you flash onto a new device or after a wipe, a bundle is what updates one already in the field.
# Both delegate to image.yml so the rootfs recipe exists once.
#
# TAG NAMESPACE: `card/v*`, NOT a bare `v*`. The two artifacts have independent cadences — a bundle
# ships far more often than a card — so they get independent tag namespaces rather than sharing one
# and hoping. This also fixes a real inversion: while this workflow triggered on `v*` and
# release-bundle.yml had no tag trigger at all, tagging a release built a card and NEVER a bundle,
# which is backwards from how the two actually ship. `card/v1.3.0` and `ota/v1.3.0` on the same
# commit mean the same OS delivered two ways; a run of ota tags with no card between them is normal.
#
# NEEDS NO SIGNING KEY AND NO R2 CREDENTIAL. Nothing here is signed — an sdcard is flashed over USB
# by someone holding the device, so there is no signature for anything to verify — and since
# 2026-10-13 the card is a GitHub Release asset rather than an R2 object. A release card measured
# 524 MiB under gz -6 that day (b6abe83, 5.5 GB nominal / 1.9 GB real), a quarter of GitHub's 2 GiB
# per-asset cap; the 5.08 GiB that put it in R2 (2026-08-04) was a root still carrying an x86 stack.
# The only credential left is the job-scoped GITHUB_TOKEN.
#
# THE REPO IS PRIVATE, so a Release asset needs a GitHub login with access to os-build to download.
# Accepted on 2026-10-13 for now; when cards are meant for the public, either the repo goes public or
# the release job moves to a public releases repo with a token scoped to it.
#
# THE `release-cards` ENVIRONMENT STILL GATES THE RELEASE JOB, for its reviewer rather than its
# secrets: a Release is the record people flash from, so a person signs off on a finished build
# before one is cut. Its policy allows the `card/v*` tags AND `main`, because a dispatch with
# publish:true is a supported way to cut a card and a tag-only policy would reject it at the gate.
#
# A LOCAL `make sdcard` PRODUCES THE SAME KIND OF IMAGE. It used to fail an artifact-pin gate by
# design, which made flashing this workflow's output the only way to see a real release image; that
# gate was retired 2026-08-04. What this workflow still has that a dev box does not is a clean
# builder, a reviewer, and a version string tied to a tag.
name: release sdcard

on:
  # Manual by default: a card is cut when someone wants one, not on every push.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for this card, with its v (e.g. v1.3.0 -> tag card/v1.3.0; default: v<date>.<shortsha>)'
        required: false
        type: string
        default: ''
      publish:
        description: 'Cut a GitHub Release carrying the card (off for a plain test build)'
        required: false
        type: boolean
        default: false
  push:
    tags:
      - 'card/v*'

permissions:
  contents: read

jobs:
  # The version has to be computed in a shell step, not an expression: GitHub's expression language
  # has no string-replace, so `card/v1.3.0` -> `1.3.0` cannot be done inline. Keeping it here rather
  # than inside image.yml leaves image.yml's contract simple — it takes a bare version string and
  # knows nothing about our tag scheme.
  prep:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_VERSION:-}" ]; then
            v="$INPUT_VERSION"
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            v="${REF_NAME#card/}"
          else
            # A dispatch with no version still needs to name itself, or the release tag and the
            # image's own /etc/retroforge-release would both say "unset". A DOT, not a dash: the
            # pre-release check below refuses any `-`, so `date-sha` failed every such dispatch.
            # The leading `v` matches what a tag run yields, since `card/` is all it strips.
            v="v$(date -u +%Y%m%d).$(echo "$GITHUB_SHA" | cut -c1-7)"
          fi
          # This becomes a URL path segment; refuse anything that could escape it here rather than
          # discovering it after a four-hour build.
          case "$v" in
            *[!A-Za-z0-9._-]*) echo "::error::version '$v' has characters that do not belong in a URL path"; exit 1 ;;
          esac
          # THERE IS NO SUCH THING AS A BETA CARD. release-bundle.yml reads a semver pre-release
          # suffix as "publish to the beta channel" (its prep job carries the reasoning), so
          # `card/v0.3.0-beta.1` is a tag that LOOKS like it selects something and cannot: a card is
          # a flashable image, not a channel, and every card lands a device on `stable` —
          # ota.conf is written only by rootfs/lib-assemble-devcard.sh, which a release build never
          # sources, so a release image ships no /etc/retroforge/ota.conf and
          # retroforge-update falls through to its built-in DEFAULT_CHANNEL.
          #
          # Refused rather than silently accepted, because the failure is otherwise invisible: the
          # card would build, publish, flash and run, and the only symptom of the misunderstanding
          # would be a device someone believed was on beta quietly taking stable releases.
          case "$v" in
            *-*) echo "::error::version '$v' carries a pre-release suffix, which on an ota/ tag means the beta channel. There is no beta card: every card lands on stable. Tag the card without the suffix."; exit 1 ;;
          esac
          # A tag always publishes. A dispatch publishes only when asked, so the common case —
          # "does this still build?" — cannot cut a Release nobody asked for.
          if [ "$GITHUB_REF_TYPE" = tag ] || [ "${INPUT_PUBLISH:-false}" = true ]; then
            p=true
          else
            p=false
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "publish=$p" >> "$GITHUB_OUTPUT"
          echo "version=$v publish=$p" >> "$GITHUB_STEP_SUMMARY"

  # NO SECRETS AND NO ENVIRONMENT. Nothing in a card build is signed and nothing in it is uploaded,
  # so this job — the long one, six hours of bootstrapping a rootfs and compiling the overlay from
  # third-party sources as uid 0 — has no credential in scope at all. It ends at a workflow artifact.
  #
  # Do not hand it `secrets: inherit` or an environment to "simplify" publishing. A job that calls a
  # reusable workflow cannot declare an environment, so an environment-scoped secret mapped here
  # resolves to the EMPTY STRING with no warning — the old R2 upload died six hours in on exactly
  # that. Anything that needs a credential or an approval belongs in an ordinary job after this one.
  sdcard:
    needs: prep
    uses: ./.github/workflows/image.yml
    with:
      artifact: sdcard
      version: ${{ needs.prep.outputs.version }}

  # The publish half: the card, its checksums and its provenance, as one GitHub Release. Split from
  # the build so the reviewer's approval lands on a finished image rather than before a six-hour
  # build, so `contents: write` is scoped to this job alone (the build, which runs far more
  # third-party code, stays read-only), and so a failed upload is "Re-run failed jobs" rather than a
  # rebuild.
  #
  # PUBLISH IS NOT THE SAME AS TAG: a `workflow_dispatch` with publish:true is a supported way to cut
  # a card, so this gates on prep's `publish` output and creates the `card/<version>` tag itself,
  # on the commit that was built, when the run did not start from one — the exact inverse of prep
  # stripping `card/` from a tag, so a dispatch of `v1.3.0` and a push of `card/v1.3.0` produce the
  # same tag and the same version string in the image. The common case — a dispatch
  # answering "does this still build?" — skips this job entirely, and the image still lands as a
  # workflow artifact to download.
  release:
    needs: [prep, sdcard]
    if: needs.prep.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # For the reviewer, not for secrets — see the header. `release-cards`, not `release-signing`:
    # that environment's deployment policy is `ota/v*` and would reject every `card/v*` tag.
    environment: ${{ vars.CARDS_ENVIRONMENT || 'release-cards' }}
    steps:
      # FIRST, because checkout cleans the workspace and the downloads below land in it. Full
      # history and tags, because the notes summarise the commits since the previous card/ tag.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Never fails the release: on any Workers AI failure the script writes the plain commit list.
      - name: write the release notes
        env:
          # Cloudflare Workers AI, the account that holds the OTA bucket (see the script's header).
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
          RELEASE_NOTES_MODEL: ${{ vars.RELEASE_NOTES_MODEL }}
          VERSION: ${{ needs.prep.outputs.version }}
        run: .github/scripts/release-notes.sh "card/$VERSION" "$GITHUB_SHA" "$RUNNER_TEMP/changes.md"

      # download-artifact v8 ERRORS on a digest mismatch rather than warning as v4 did, and that
      # default is deliberately left alone: the alternative is attaching a corrupted card next to a
      # sha256sums.txt that describes the good bytes.
      - name: fetch the card
        uses: actions/download-artifact@v8
        with:
          name: retroforge-sdcard
          path: upload

      - name: fetch the metadata
        uses: actions/download-artifact@v8
        with:
          name: retroforge-sdcard-meta
          path: meta

      # GitHub refuses an asset over 2 GiB, but only once the upload is under way. Check first, so a
      # card that has grown says so in plain words rather than as an HTTP error from gh.
      - name: check the card fits a release asset
        env:
          VERSION: ${{ needs.prep.outputs.version }}
        run: |
          set -euo pipefail
          size="$(stat -c %s "upload/retroforge-$VERSION.img.gz")"
          limit=$((2 * 1024 * 1024 * 1024))
          echo "card: $((size / 1048576)) MiB of a $((limit / 1048576)) MiB asset cap" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$size" -ge "$limit" ]; then
            echo "::error::retroforge-$VERSION.img.gz is $size bytes, over GitHub's 2 GiB per-asset cap. Shrink the card, or move it to a host without the cap (git history has the old R2 publisher, ota/publish-card.sh)."
            exit 1
          fi

      # The asset keeps its built name, retroforge-<version>.img.gz (set in image.yml), because
      # sha256sums.txt names it that way — renaming it here would make `sha256sum -c` fail on a good
      # download.
      #
      # THE NOTES DO NOT TELL ANYONE TO RUN `gh release download`: the image is right there in the
      # release's assets, and a user found the CLI recipe confusing (2026-11-07). They open with what
      # changed (written by Cloudflare Workers AI from the commits since the previous card, see the step
      # above), then say which file to take, how to check it, and how to write it.
      #
      # A TAG THAT ALREADY EXISTS MUST BE THIS COMMIT. When the tag is missing, the release API
      # creates it on --target; when it exists, the API uses it as-is and IGNORES --target. So a
      # dispatch reusing a version whose tag sits on an older commit would hang this build's card
      # on that commit, under a tag that says it was built from there. Checked against the API,
      # not a checkout: matching-refs is a prefix match, hence the exact-ref filter, and a missing
      # ref answers the commits endpoint with 422 rather than 404, hence asking existence first.
      # The commits endpoint peels an annotated tag to its commit.
      - name: cut the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prep.outputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="card/$VERSION"
          fi
          exists="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$tag" \
            --jq "map(select(.ref == \"refs/tags/$tag\")) | length")"
          if [ "$exists" != 0 ]; then
            at="$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/$tag" --jq .sha)"
            if [ "$at" != "$GITHUB_SHA" ]; then
              echo "::error::tag $tag already exists on $at, but this card was built from $GITHUB_SHA. Pick a new version, or run from the tag itself."
              exit 1
            fi
          fi
          img="retroforge-$VERSION.img.gz"
          {
            echo "## RetroForge $VERSION"
            echo
            cat "$RUNNER_TEMP/changes.md"
            echo
            echo '### Install'
            echo
            echo "Download **\`$img\`** from the assets below and write it to an SD card with"
            echo 'balenaEtcher or Raspberry Pi Imager (both take the `.img.gz` as is), or from a shell:'
            echo
            echo '```bash'
            echo 'sha256sum -c sha256sums.txt   # check the download before writing it'
            echo "gzip -dc $img | sudo dd of=/dev/sdX bs=4M conv=fsync status=progress"
            echo '```'
            echo
            echo '`manifest.lock` records every package this card was built from — third-party ones by'
            echo 'sha256, ours by the digest of the sources they were compiled from in this run.'
          } > notes.md
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "RetroForge $VERSION" \
            --notes-file notes.md \
            "upload/$img" meta/sha256sums.txt meta/provenance/manifest.lock
