# Daily upstream watchers, ported from Nova-Deck's upstream-watch.yml. NO job bumps anything —
# each detects that an upstream we track moved and opens ONE issue assigned to the maintainer to
# run the manual revalidation drill.
# Every job is deliberately stateless: it takes its baseline FROM REPO STATE (the pin / the
# PKGBUILD), so there is no side channel to keep in step and a bump silences its own watcher.
# Every job FAILS when its upstream parse yields nothing: a watcher that cannot see must go red,
# not stay quietly green.
#
# Issue titles are the dedupe key everywhere (searched across open AND closed), so a watcher that
# reports a version we decide NOT to take is answered by closing its issue once.
#
# Nova-Deck's FEX rootfs, Proton and lsfg-vk jobs are not ported: RetroForge ships none of them.
name: upstream-watch

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch: {}

permissions:
  issues: write
  contents: read

env:
  ASSIGNEE: loki666
  # Every issue carries this one label; it must exist in the repo or `gh issue create` fails.
  LABEL: upstream

jobs:
  kernel:
    name: linux release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Compare kernel.org releases against the pin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Baseline is kernel/SOURCE.pin's version:, read with the same parse kernel/build.sh
          # uses, so the watcher and the build can never disagree about what we ship.
          pinned="$(sed -n 's/^version:[[:space:]]*//p' kernel/SOURCE.pin | head -1)"
          [ -n "$pinned" ] || { echo "::error::kernel/SOURCE.pin has no version: field"; exit 1; }
          # First two components: 7.2 and 7.2.4 are both in series 7.2.
          series="$(printf '%s' "$pinned" | cut -d. -f1,2)"

          json="$(curl -fsSL --retry 3 https://www.kernel.org/releases.json)"
          # Real release lines only. linux-next is a daily snapshot we would never pin, and an EOL
          # line is a dead end. Anything carrying a dash is an -rc: mainline sits at 7.3-rcN for
          # weeks before 7.3 exists, and reporting one would be reporting a tarball we cannot ship.
          # `|| true` so the guard below reports rather than `set -e` killing the step mute.
          versions="$(printf '%s' "$json" | jq -r '.releases[]
              | select(.iseol == false)
              | select(.moniker == "mainline" or .moniker == "stable" or .moniker == "longterm")
              | .version' | grep -v -- '-' || true)"
          [ -n "$versions" ] || { echo "::error::no shippable release lines in releases.json"; exit 1; }

          # Titles carry ONLY the upstream version, never the pinned one. The dedupe key has to
          # survive our own re-pins: taking 7.2.1 while 7.2.4 is out leaves us behind, and a title
          # with "(pinned: ...)" in it would re-file the 7.2.4 issue we already closed.
          file_issue() {
            local title="$1" body="$2"
            if [ "$(gh issue list --state all --search "in:title \"$title\"" --json number --jq length)" -gt 0 ]; then
              echo "issue already filed: $title"; return 0
            fi
            gh issue create --title "$title" --assignee "$ASSIGNEE" --label "$LABEL" --body "$body"
          }
          src() { printf '%s' "$json" | jq -r --arg v "$1" '.releases[] | select(.version == $v) | .source'; }

          # --- the point release in the series we already ship ---
          esc="$(printf '%s' "$series" | sed 's/\./\\./g')"
          latest="$(printf '%s\n' "$versions" | grep -E "^${esc}\.[0-9]+$" | sort -V | tail -1 || true)"
          # sort -V, not text: 7.2.10 is newer than 7.2.9. Quiet when we already pin the newest,
          # and quiet if we ever pin ahead of the index.
          newest="$(printf '%s\n%s\n' "$pinned" "${latest:-$pinned}" | sort -V | tail -1)"
          echo "pinned=$pinned latest-in-series=${latest:-none}"
          if [ -n "$latest" ] && [ "$latest" != "$pinned" ] && [ "$newest" = "$latest" ]; then
            file_issue "upstream: linux $latest released" "$(cat <<EOF
          Upstream released **linux $latest**; we pin **$pinned**. Same series, so this is the
          cheap bump: no patch rebase is expected, and the risk is that it quietly is not.
          Tarball: $(src "$latest")
          Changelog: https://cdn.kernel.org/pub/linux/kernel/v${series%%.*}.x/ChangeLog-$latest

          - [ ] \`kernel/SOURCE.pin\`: version + url + sha256 together. Take the sha256 from kernel.org's **signed** \`sha256sums.asc\` for the series — hashing whatever the CDN served proves only that the CDN is self-consistent
          - [ ] \`git_tag\` + \`git_commit\`: the **dereferenced** tag (\`git ls-remote ... 'v$latest^{}'\`), not the annotated tag object
          - [ ] grep the ChangeLog for drm/msm, qcom clk/phy/iommu, ath1x, mac80211 and soundwire — those are the legs that have broken us before (7.2.6 killed WCN7850 Wi-Fi); delete any of our patches that landed
          - [ ] re-apply \`kernel/patches/\` **cumulatively, in lexical order, to one tree** — the way kernel/build.sh does. Dry-running each patch against a pristine tree reports false failures, because several of them patch files an earlier patch creates
          - [ ] config: every \`CONFIG_*\` named in \`kernel/*.config\` must still exist in the patched tree; kernel/build.sh asserts each trim took effect, and its unshipped-qcom note names new Qualcomm SoC drivers to add to \`kernel/trim-qcom-socs.config\`
          - [ ] record the re-pin in \`kernel/SOURCE.pin\`'s header, then a HW pass on one board per SoC (SM8250, SM8550, SM8650) before this becomes the shipped kernel

          Closing this issue is a legitimate answer — a point release we decide to skip stays
          skipped, and the title dedupe will not re-file it.
          EOF
          )"
          fi

          # --- a whole new series ---
          # Series-level compare, so this fires ONCE when 7.3 lands and stays quiet while its own
          # point releases roll past under the stable moniker.
          upstream_series="$(printf '%s\n' "$versions" | cut -d. -f1,2 | sort -uV | tail -1)"
          top="$(printf '%s\n%s\n' "$series" "$upstream_series" | sort -V | tail -1)"
          if [ "$upstream_series" != "$series" ] && [ "$top" = "$upstream_series" ]; then
            head_version="$(printf '%s\n' "$versions" | grep -E "^$(printf '%s' "$upstream_series" | sed 's/\./\\./g')(\.[0-9]+)?$" | sort -V | head -1)"
            file_issue "upstream: linux $upstream_series opened" "$(cat <<EOF
          Upstream opened the **linux $upstream_series** series; we pin **$pinned**. This is the
          expensive bump — treat it as a project, not a pin edit.
          Tarball: $(src "$head_version")
          Diff: https://git.kernel.org/torvalds/ds/v$upstream_series/v$series

          Everything in the point-release drill applies, plus the two things that only a series
          bump can do to us:

          - [ ] **find the patches upstream took**, and delete them rather than carry them. Read *how* it took them: a rewrite can land with an **incompatible DT binding**, which then has to be migrated across every board DTS that consumes it
          - [ ] **read what upstream deleted.** A \`CONFIG_*\` symbol removed upstream is silently ignored by kconfig, so a stale name in our fragments is invisible until the driver is missing on hardware
          - [ ] budget a full display/panel HW gate on every roster board — the bonded S2 panel and the inline rotator are the tightest. The failure mode of a bad panel-power migration is a lit backlight over a black panel; it does not look like a kernel problem
          - [ ] record the outcome in \`kernel/SOURCE.pin\`'s header, including what was taken over and what it cost. That header is how the next bump knows what to re-check

          There is no deadline here: a series we choose not to take is answered by closing this
          issue once.
          EOF
          )"
          fi

  mesa:
    name: mesa release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Compare the mesa archive index against the PKGBUILD
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # packages/mesa/source.pin carries no version — the tarball is named in the PKGBUILD, and
          # THAT is the single source of truth a bump edits. So the baseline is pkgver.
          pinned="$(sed -n 's/^pkgver=//p' packages/mesa/PKGBUILD | head -1)"
          [ -n "$pinned" ] || { echo "::error::packages/mesa/PKGBUILD has no pkgver= line"; exit 1; }

          # Three numeric components only: the archive lists -rcN candidates next to releases and we
          # must never pin one. sort -V then orders 26.10.0 after 26.9.0, which text sort would not.
          # `|| true` so the guard below reports rather than `set -e` killing the step mute.
          latest="$(curl -fsSL --retry 3 https://archive.mesa3d.org/ \
            | grep -oE 'mesa-[0-9]+\.[0-9]+\.[0-9]+\.tar\.xz' \
            | sed -E 's/^mesa-(.*)\.tar\.xz$/\1/' | sort -uV | tail -1 || true)"
          [ -n "$latest" ] || { echo "::error::no release tarballs found in the archive.mesa3d.org index"; exit 1; }

          echo "pinned=$pinned latest=$latest"
          # Newer, not merely different: if we ever pin ahead of the index this must stay quiet.
          newer="$(printf '%s\n%s\n' "$pinned" "$latest" | sort -V | tail -1)"
          if [ "$latest" = "$pinned" ] || [ "$newer" != "$latest" ]; then
            echo "pin is current"
            exit 0
          fi

          title="upstream: mesa $latest released (pinned: $pinned)"
          if [ "$(gh issue list --state all --search "in:title \"$title\"" --json number --jq length)" -gt 0 ]; then
            echo "issue already filed for $latest"; exit 0
          fi
          gh issue create --title "$title" --assignee "$ASSIGNEE" --label "$LABEL" --body "$(cat <<EOF
          Upstream released **mesa $latest**; we build **$pinned**.
          Tarball: https://archive.mesa3d.org/mesa-$latest.tar.xz

          Integrity: mesa publishes NO \`.sha256sum\` sidecar — that URL 404s. The only upstream
          artifact is the detached \`.sig\`. Compute the sha256 locally from a tarball whose \`.sig\`
          verifies, and check the signer against the fingerprint recorded in the \`sha256sums\`
          provenance comment in \`packages/mesa/PKGBUILD\`. A GOOD signature from an unknown-trust
          key only proves the tarball matches whatever key came with it; continuity with the last
          release we validated on hardware is the load-bearing step. Drill:

          - [ ] verify the tarball's detached \`.sig\` and confirm the signer is the SAME key as the currently pinned release's, BEFORE recording any sha256 (see Integrity above)
          - [ ] \`packages/mesa/PKGBUILD\`: pkgver + the tarball sha256sums entry together
          - [ ] \`packages/mesa/source.pin\`: the informational url/sha256 comment lines (and \`mirror.pin\` if it names the tarball)
          - [ ] re-roll every patch under \`packages/mesa/patches/\` against the new tag — they are applied \`patch -p1\` with no fuzz budget, so a rebase failure is a build failure. Drop the ones upstream took (\`patches/README.md\` says when each can go)
          - [ ] \`make overlay\` then \`make relock\`: mesa emits SEVERAL packages and every row it owns carries the pkgbase input hash — let packages/verify-lock-rows.sh (in \`make test\`) confirm no sibling row kept the old hash
          - [ ] HW pass on one board per Adreno generation (A650 SM8250, A740 SM8550, A750 SM8650): the shell plus a Vulkan-heavy emulator each (Dolphin, Cemu, RPCS3), and Flycast on A610 if an SM6115 board is at hand
          EOF
          )"

  scx:
    name: scx-scheds (Valve holo-main) release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Compare Valve's holo-main source tarballs against the PKGBUILD
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Unlike Nova-Deck's job this watches VALVE'S tree, not sched-ext/scx releases: the
          # PKGBUILD builds from Valve's holo-main source tarball (upstream v1.1.3 stalls lavd under
          # game load), so a new upstream tag is not something we could take. Baseline is pkgver.
          pinned="$(sed -n 's/^pkgver=//p' packages/scx-scheds/PKGBUILD | head -1)"
          [ -n "$pinned" ] || { echo "::error::packages/scx-scheds/PKGBUILD has no pkgver= line"; exit 1; }

          base=https://steamdeck-packages.steamos.cloud/archlinux-mirror/sources/holo-main
          # Tarballs are scx-scheds-<pkgver>-<pkgrel>.src.tar.gz; strip the pkgrel so versions
          # compare against our pkgver. `|| true` so the guard below reports rather than going mute.
          tarballs="$(curl -fsSL --retry 3 "$base/" \
            | grep -oE 'scx-scheds-[0-9][^"<>/]*\.src\.tar\.gz' | sort -u || true)"
          [ -n "$tarballs" ] || { echo "::error::no scx-scheds-*.src.tar.gz in $base/ — the index format changed"; exit 1; }
          latest_file="$(printf '%s\n' "$tarballs" \
            | sed -E 's/^scx-scheds-(.*)-([0-9.]+)\.src\.tar\.gz$/\1\t&/' | sort -V -k1,1 | tail -1)"
          latest="${latest_file%%$'\t'*}"; latest_file="${latest_file#*$'\t'}"

          echo "pinned=$pinned latest=$latest ($latest_file)"
          # Newer, not merely different: if we ever pin ahead of the index this stays quiet.
          newer="$(printf '%s\n%s\n' "$pinned" "$latest" | sort -V | tail -1)"
          if [ "$latest" = "$pinned" ] || [ "$newer" != "$latest" ]; then
            echo "pin is current"
            exit 0
          fi

          title="upstream: scx-scheds $latest in holo-main (pinned: $pinned)"
          if [ "$(gh issue list --state all --search "in:title \"$title\"" --json number --jq length)" -gt 0 ]; then
            echo "issue already filed for $latest"; exit 0
          fi
          gh issue create --title "$title" --assignee "$ASSIGNEE" --label "$LABEL" --body "$(cat <<EOF
          Valve published **scx-scheds $latest** in holo-main; we build **$pinned**.
          Source: $base/$latest_file

          scx_lavd is opt-in (retroforge-scheduler defaults to \`none\`, the stock in-kernel EEVDF),
          so a regression here is INVISIBLE to anyone who never turns it on. That cuts both ways:
          it is a low-risk bump to take, and a bad one can sit unnoticed. Drill (the PKGBUILD header
          has the full procedure):

          - [ ] \`packages/scx-scheds/PKGBUILD\`: pkgver + sha256sums + \`_commit\` together (\`git --git-dir=scx-scheds/scx rev-parse v<pkgver>^{commit}\`); \`prepare()\` re-asserts the hash itself, because build-overlay.sh runs makepkg with \`--skipinteg\`
          - [ ] \`services/scx.service\` and \`services/scx\` still exist, and \`services/scx\` still sets the flags \`package()\` asserts
          - [ ] re-read the tree's own \`kernel.config\` against \`kernel/kernel.config\` — it is upstream's authoritative CONFIG_* list and it does change between releases
          - [ ] the \`disable_rustfmt\` sentinel is still what \`bpf_builder.rs\` calls (the shim in \`build()\` only answers that name), and the vendored crates still let \`build()\` run \`--frozen\`
          - [ ] \`make overlay\` then \`make relock\`; read the \`rootfs/manifest.lock\` diff rather than refreshing it blind
          - [ ] HW pass with the scheduler actually SELECTED (\`retroforge-scheduler lavd\`) and a real emulator gameplay leg, and confirm lavd still follows the active power profile from retroforge-powerd
          EOF
          )"

  # The base repo: Valve's archlinux-deckard snapshot tree (build/snapshot.pin). The pin is always a
  # FROZEN revision (mash-YYYYMMDD.N[.pvt]; build/lib-pins.sh refuses the moving alias), so two
  # questions, both about something newer than the pin:
  #   1. is there a snapshot with a NEWER date (in any form — mash-YYYYMMDD, .N, .N.pvt)?
  #   2. is there a newer REVISION of the pinned date (pinned .1.pvt, .2.pvt published)? Valve
  #      republishes a date with fixes — mash-20260305 went .1.pvt -> .2.pvt.
  deckard-base:
    name: archlinux-deckard snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Compare the snapshot index against build/snapshot.pin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          url="$(grep -vE '^[[:space:]]*(#|$)' build/snapshot.pin | tail -1)"
          name="${url##*/}"; base="${url%/*}"
          pinned_date="$(printf '%s' "$name" | grep -oE '^mash-[0-9]{8}' | cut -c6- || true)"
          [ -n "$pinned_date" ] || { echo "::error::build/snapshot.pin does not name a mash-YYYYMMDD snapshot: $url"; exit 1; }

          listing="$(curl -fsSL --retry 3 "$base/")"
          dirs="$(printf '%s' "$listing" | grep -oE 'mash-[0-9]{8}[0-9a-z.-]*/' | tr -d / | sort -u || true)"
          [ -n "$dirs" ] || { echo "::error::no mash-* directories in $base/ — the index format changed"; exit 1; }
          latest_date="$(printf '%s\n' "$dirs" | grep -oE '^mash-[0-9]{8}' | cut -c6- | sort -u | tail -1)"
          echo "pinned=$name ($pinned_date) latest_date=$latest_date"

          file_issue() {  # file_issue <title> <body>
            if [ "$(gh issue list --state all --search "in:title \"$1\"" --json number --jq length)" -gt 0 ]; then
              echo "issue already filed: $1"; return 0
            fi
            gh issue create --title "$1" --assignee "$ASSIGNEE" --label "$LABEL" --body "$2"
          }

          if [ "$latest_date" \> "$pinned_date" ]; then
            newest="$(printf '%s\n' "$dirs" | grep "^mash-$latest_date" | tr '\n' ' ')"
            file_issue "upstream: archlinux-deckard mash-$latest_date published (pinned: $name)" "$(cat <<EOF
          Valve published a newer archlinux-deckard snapshot: **mash-$latest_date** (we pin **$name**).
          Directories for that date: \`$newest\`
          Index: $base/

          Bump drill:
          - [ ] pin a FROZEN revision (\`.N\` or \`.N.pvt\`); build/lib-pins.sh refuses the bare \`mash-YYYYMMDD\` alias
          - [ ] diff the locked package NAMES against the new snapshot: a package can leave the public tree while Valve still ships it from a private layer (missing holo packages become an overlay PKGBUILD under packages/)
          - [ ] diff the vendor \`pacman.conf\` / \`pacman.mirrorlist\` against the previous snapshot's
          - [ ] \`build/builder.pin\`: sha256 of \`<snapshot>/system.rootfs.zst\`, changed TOGETHER with snapshot.pin
          - [ ] \`make overlay\` — the builder pin is in every overlay input hash, so ALL packages rebuild
          - [ ] \`make relock\`; review added/dropped names — a package SPLIT drops a binary silently (libinput -> libinput-tools took the power key down)
          - [ ] \`packages/libinput\`: its \`libinput=\$pkgver\` dependency fails the resolve if the snapshot moved libinput — bump pkgver to match
          - [ ] \`packages/pygame-ce/prebuilt.pin\` is a cp3XX wheel — a Python bump invalidates it
          - [ ] a RELEASE \`make sdcard\`: rootfs/guard-rootfs.sh catches a new unpinned sysusers allocation, and the assembler refuses trim.list globs that stopped matching
          - [ ] HW: boot, OGUI shell, power key suspend + wake, an emulator per GPU generation, audio, Wi-Fi
          EOF
          )"
          else
            echo "no newer snapshot date"
          fi

          # Newer revision of the pinned date, on either publishing line (.N or .N.pvt).
          pinned_rev="$(printf '%s' "$name" | sed -n 's/^mash-[0-9]\{8\}\.\([0-9]\{1,\}\).*/\1/p')"
          [ -n "$pinned_rev" ] || { echo "::error::build/snapshot.pin is not a frozen mash-YYYYMMDD.N[.pvt] revision: $name"; exit 1; }
          latest_rev="$(printf '%s\n' "$dirs" | sed -n "s/^mash-$pinned_date\.\([0-9]\{1,\}\)\(\.pvt\)\{0,1\}\$/\1/p" | sort -n | tail -1)"
          echo "pinned revision=$pinned_rev latest revision of that date=${latest_rev:-none}"
          if [ -n "$latest_rev" ] && [ "$latest_rev" -gt "$pinned_rev" ]; then
            revs="$(printf '%s\n' "$dirs" | grep "^mash-$pinned_date\." | tr '\n' ' ')"
            file_issue "upstream: archlinux-deckard mash-$pinned_date.$latest_rev published (pinned: $name)" "$(cat <<EOF
          Valve republished the pinned date: revision **.$latest_rev** of mash-$pinned_date (we pin **$name**).
          Revisions for that date: \`$revs\`

          - [ ] diff its core.db/extra.db against the pinned revision — a respin usually carries fixes
          - [ ] follow the bump drill: \`build/snapshot.pin\` + \`build/builder.pin\`, \`make overlay\`, relock both, a release card, HW
          EOF
          )"
          fi
