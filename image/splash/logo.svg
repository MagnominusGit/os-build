<?xml version="1.0" encoding="UTF-8"?>
<!-- RetroForge boot splash logo: the anvil-cat badge (logo.png, beside this file).

     Square on purpose: image/mksplash.sh renders it into a square box and the drawer centres it on
     the panel at a fixed share of its short edge. The badge comes with no padding and fills the box
     top to bottom (260 units), centred across, width from the PNG's 1458x1634 aspect.

     The artwork is a raster, referenced rather than embedded: rsvg-convert resolves an href next to
     the SVG, and base64 would triple a 2 MB PNG in a text file. Its background is transparent, and
     there is no background rect here either, deliberately: the drawer fills the panel with its own
     background colour (black by default) and composites this over it with real alpha. Baking a
     black square in here would show as a hard-edged box the moment the background is anything but
     pure black, and would also cost the asset its alpha channel entirely (rsvg-convert emits RGB,
     not RGBA, for a fully opaque image, which image/png2nds1.py rejects). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="150 70 260 260" width="260" height="260" role="img" aria-label="RetroForge">
  <image href="logo.png" x="164.00" y="70" width="232.00" height="260" preserveAspectRatio="xMidYMid meet"/>
</svg>
