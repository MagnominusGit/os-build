# MANGMI Air X / Air Y (SM6115) — force S16LE on the cards' PCMs.
#
# The counterpart to Qualcomm/sm6115/MangmiAirX and MangmiAirY HiFi.conf: the AudioReach topology
# (firmware/topology/MangmiAirX.m4) declares every stream and MI2S back end S16_LE (the ES8326 and
# AW88261 take nothing else), so the MultiMedia front-end PCMs must be opened S16LE too.
# ROCKNIX does the same for every ALSA node on this SoC (90-sm6115-s16le.conf); scoped here to the
# two cards by alsa.card_name, the `model` of each sound node. SPA-JSON, WirePlumber 0.5+.

monitor.alsa.rules = [
  {
    matches = [
      {
        alsa.card_name = "MangmiAirX"
      }
      {
        alsa.card_name = "MangmiAirY"
      }
    ]
    actions = {
      update-props = {
        audio.format = "S16LE"
      }
    }
  }
]
