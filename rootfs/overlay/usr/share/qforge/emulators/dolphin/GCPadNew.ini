; QForge first-run GameCube controller 1 for Dolphin: the InputPlumber pad as SDL sees it (one
; virtual Xbox Elite pad on every handheld). The device name is what Dolphin's OWN bundled SDL
; (3.4.16 in 2609) calls it, "Xbox One Elite 2 Controller" -- not ARMSX2's "Microsoft Xbox One
; Elite 2": a wrong name silently leaves every binding dead (HW 2026-10-05). Recheck it when the
; pin moves (Logger.ini [Logs] CI = True lists "Added device: SDL/0/..."). GameCube A/B/X/Y follow their positions (A south,
; B west, X east, Y north). Dolphin's SDL names: "Button S" etc.; vertical axes are flipped
; XInput-style, so stick up is "Left Y+".
[GCPad1]
Device = SDL/0/Xbox One Elite 2 Controller
Buttons/A = `Button S`
Buttons/B = `Button W`
Buttons/X = `Button E`
Buttons/Y = `Button N`
Buttons/Z = `Shoulder R`
Buttons/Start = Start
Main Stick/Up = `Left Y+`
Main Stick/Down = `Left Y-`
Main Stick/Left = `Left X-`
Main Stick/Right = `Left X+`
C-Stick/Up = `Right Y+`
C-Stick/Down = `Right Y-`
C-Stick/Left = `Right X-`
C-Stick/Right = `Right X+`
Triggers/L = `Trigger L`
Triggers/R = `Trigger R`
Triggers/L-Analog = `Trigger L`
Triggers/R-Analog = `Trigger R`
D-Pad/Up = `Pad N`
D-Pad/Down = `Pad S`
D-Pad/Left = `Pad W`
D-Pad/Right = `Pad E`
Rumble/Motor = Motor
