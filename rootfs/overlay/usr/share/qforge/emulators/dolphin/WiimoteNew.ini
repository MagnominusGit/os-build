; QForge first-run Wii Remote 1 for Dolphin: emulated (Dolphin's default source), held sideways,
; which most pad-friendly Wii games use (New Super Mario Bros. Wii, ...); Dolphin turns the D-Pad
; with it. 2 (jump) on south, 1 on west, A on east, B on north, - / + on Select / Start, shake on
; R1, the pointer on the right stick. Home stays unbound: the Guide button is OpenGamepadUI's.
[Wiimote1]
Device = SDL/0/Xbox One Elite 2 Controller
Options/Sideways Wiimote = True
Buttons/A = `Button E`
Buttons/B = `Button N`
Buttons/1 = `Button W`
Buttons/2 = `Button S`
Buttons/- = Back
Buttons/+ = Start
D-Pad/Up = `Pad N`
D-Pad/Down = `Pad S`
D-Pad/Left = `Pad W`
D-Pad/Right = `Pad E`
Shake/X = `Shoulder R`
Shake/Y = `Shoulder R`
Shake/Z = `Shoulder R`
IR/Up = `Right Y+`
IR/Down = `Right Y-`
IR/Left = `Right X-`
IR/Right = `Right X+`
Rumble/Motor = Motor
