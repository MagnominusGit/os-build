; QForge first-run settings for Flycast. qforge-launch copies this to ~/.config/flycast/emu.cfg only
; when that file does not exist. Flycast rewrites it when it saves settings (comments go, keys stay).
; Only what QForge decides is here; Flycast's defaults cover the rest.
; - Paths: the shared layout. BiosPath is searched for dc_boot.bin (optional: most games boot on
;   Flycast's HLE BIOS) and Naomi BIOS zips. Do NOT put dc_nvmem.bin there: Flycast saves it to
;   ~/.local/share/flycast and would keep reading the stale copy first. VMUPath: per-game VMU files;
;   SavePath: arcade nvmem; SavestatePath: save states; ContentPath: the game list (Open).
; - AutoSaveState: a resume state when the game is closed, including by OpenGamepadUI's Exit
;   (SIGTERM -> SDL_QUIT -> dc_exit saves it), as DuckStation and ARMSX2 do. AutoLoadState stays
;   off, as there: resuming is the player's choice (state slot 0).
; - pvr.rend = 4: Vulkan (Turnip); this build defaults to OpenGL.
; - Nothing to turn off: this build has no update check, no Discord and no crash upload.

[config]
Dreamcast.ContentPath = /home/player/roms/dc
Dreamcast.BiosPath = /home/player/bios/dc
Dreamcast.VMUPath = /home/player/saves/dc
Dreamcast.SavePath = /home/player/saves/dc
Dreamcast.SavestatePath = /home/player/states/dc
Dreamcast.AutoSaveState = yes
pvr.rend = 4

[window]
fullscreen = yes
