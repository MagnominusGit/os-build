# QForge first-run settings for Snes9x (GTK). qforge-launch copies this to
# ~/.config/snes9x/snes9x.conf only when it does not exist. Snes9x rewrites the whole file on every
# exit (these comments go, the keys stay). Only what QForge decides is here; Snes9x's defaults cover
# the rest -- except bindings: the GTK port has NONE by default, keyboard included.
# - FullscreenOnOpen: Snes9x has no fullscreen flag; this starts the game fullscreen, menubar hidden.
# - HardwareAcceleration = vulkan: the image's Turnip. If a driver cannot start, Snes9x shows a
#   modal "Couldn't load display driver" box; opengl is the fallback.
# - [Sound] Driver = 3: PulseAudio (pipewire-pulse). An INDEX into this build's list (0 PortAudio,
#   1 OSS, 2 ALSA, 3 PulseAudio, 4 SDL): recheck when the pin moves.
# - Files: battery saves and cheats in ~/saves/snes, save states in ~/states/snes. Satellaview /
#   Sufami Turbo BIOS files have no setting: they go next to the ROMs (~/roms/snes).
# - SaveSRAMEveryNSeconds = 1: the .srm is written a second after the game saves, not only on exit.
# - Keys are Snes9x's display names (Up, A, ...: the second column of b_links in gtk_control.cpp),
#   NOT its internal b_up/b_a names: those are silently ignored and leave every button Unset
#   (HW, Pocket ACE, 2026-10-06).
# - Joypad 0: the pad is "Joystick 1", the first SDL joystick, bound by RAW index (no name, no GUID).
#   InputPlumber's virtual Xbox Elite pad: b0 south, b1 east, b2 west, b3 north, b4 LB, b5 RB,
#   b6 Select, b7 Start. SNES buttons by POSITION: B (bottom) south, A (right) east,
#   Y (left) west, X (top) north. Snes9x reports the D-pad hat as two axes after the 6 real ones:
#   axis 6 up(+)/down(-), axis 7 left(-)/right(+) (the % is required, ignored for hats).
# - Joypad 5 is Snes9x's "1+", a second binding set for player 1: the left stick as the D-pad.
# - No pad shortcut: Snes9x binds one button per action, never a combination, so it cannot have
#   Select + Start; a single button (R3) was too easy to hit by mistake. OpenGamepadUI's Exit
#   (Guide) closes it. Guide stays unbound: OpenGamepadUI owns it.

[Display]
FullscreenOnOpen = true
HardwareAcceleration = vulkan

[Sound]
Driver = 3

[Files]
SRAMDirectory = /home/player/saves/snes
SaveStateDirectory = /home/player/states/snes
CheatDirectory = /home/player/saves/snes

[Emulation]
SaveSRAMEveryNSeconds = 1

[Joypad 0]
Up = Joystick 1 Axis 6 + 50%
Down = Joystick 1 Axis 6 - 50%
Left = Joystick 1 Axis 7 - 50%
Right = Joystick 1 Axis 7 + 50%
Start = Joystick 1 Button 7
Select = Joystick 1 Button 6
A = Joystick 1 Button 1
B = Joystick 1 Button 0
X = Joystick 1 Button 3
Y = Joystick 1 Button 2
L = Joystick 1 Button 4
R = Joystick 1 Button 5

[Joypad 5]
Up = Joystick 1 Axis 1 - 50%
Down = Joystick 1 Axis 1 + 50%
Left = Joystick 1 Axis 0 - 50%
Right = Joystick 1 Axis 0 + 50%
