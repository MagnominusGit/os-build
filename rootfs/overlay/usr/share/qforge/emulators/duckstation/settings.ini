; QForge first-run settings for DuckStation. qforge-launch copies this to
; ~/.local/share/duckstation/settings.ini only when that file does not exist, so
; whatever the player changes in DuckStation afterwards is kept.
;
; Every handheld reaches emulators as ONE controller: InputPlumber turns each
; device's joypad into a virtual Xbox Elite pad (/etc/inputplumber/devices.d),
; which SDL sees as SDL-0. So this mapping is the same on every device.
;
; - SetupWizardIncomplete = false skips the wizard, and with it the wizard's
;   controller auto-map, hence the explicit [Pad1] below.
; - OpenPauseMenu: DuckStation binds its menu to keyboard Escape only, so a
;   controller could never reach Exit. Select + Start opens it.
; - Guide stays unbound: OpenGamepadUI owns it.
; HW-verified on the MANGMI Pocket Max, 2026-10-03.

[Main]
SetupWizardIncomplete = false
ConfirmPowerOff = false
EnableDiscordPresence = false
StartFullscreen = true

[AutoUpdater]
CheckAtStartup = false

[BIOS]
SearchDirectory = /home/player/bios

[GameList]
RecursivePaths = /home/player/roms/psx

[GPU]
Renderer = Vulkan

[InputSources]
SDL = true

[Pad1]
Type = AnalogController
Up = SDL-0/DPadUp
Right = SDL-0/DPadRight
Down = SDL-0/DPadDown
Left = SDL-0/DPadLeft
Triangle = SDL-0/Y
Circle = SDL-0/B
Cross = SDL-0/A
Square = SDL-0/X
Select = SDL-0/Back
Start = SDL-0/Start
L1 = SDL-0/LeftShoulder
R1 = SDL-0/RightShoulder
L2 = SDL-0/+LeftTrigger
R2 = SDL-0/+RightTrigger
L3 = SDL-0/LeftStick
R3 = SDL-0/RightStick
LLeft = SDL-0/-LeftX
LRight = SDL-0/+LeftX
LDown = SDL-0/+LeftY
LUp = SDL-0/-LeftY
RLeft = SDL-0/-RightX
RRight = SDL-0/+RightX
RDown = SDL-0/+RightY
RUp = SDL-0/-RightY
SmallMotor = SDL-0/SmallMotor
LargeMotor = SDL-0/LargeMotor

[Hotkeys]
OpenPauseMenu = SDL-0/Back & SDL-0/Start
