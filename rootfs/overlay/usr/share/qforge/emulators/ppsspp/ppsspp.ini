; QForge first-run settings for PPSSPP. qforge-launch copies this to
; ~/.config/ppsspp/PSP/SYSTEM/ppsspp.ini only when that file does not exist, so whatever the player
; changes in PPSSPP afterwards is kept. Only what QForge decides is here; PPSSPP's defaults cover
; every key left out.
; - FirstRun = False: no "Press ESC to open the pause menu" banner (a pad player has no Escape).
; - CheckForNewVersion = False: QForge pins the version. DiscordRichPresence: off (the default).
; - AskForExitConfirmationAfterSeconds = 0: otherwise Exit asks "you haven't saved for N minutes"
;   after 5 minutes without a save -- a dialog in front of every exit.
; - CurrentDirectory: Open's file browser starts in ~/roms/psp.
; - GraphicsBackend = 3: Vulkan (Turnip); PPSSPP's Linux default is OpenGL.
; - Saves and states: PPSSPP keeps them on its memory stick (~/.config/ppsspp/PSP/SAVEDATA and
;   PPSSPP_STATE, no setting); user tmpfiles (qforge-home.conf) make those two links to ~/saves/psp
;   and ~/states/psp. No BIOS needed (HLE). No save state on exit (PPSSPP has no such option).

[General]
FirstRun = False
CheckForNewVersion = False
DiscordRichPresence = False
AskForExitConfirmationAfterSeconds = 0
CurrentDirectory = /home/player/roms/psp

[Graphics]
GraphicsBackend = 3
