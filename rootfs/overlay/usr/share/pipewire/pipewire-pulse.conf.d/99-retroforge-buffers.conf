# Match the 512-sample floor for PulseAudio clients (OpenGamepadUI's Godot audio driver talks PulseAudio, i.e. pipewire-pulse).
# Prevents apps from requesting sub-512 buffers that underrun on the SM8650 path.
pulse.properties = {
    pulse.min.req     = 512/48000
    pulse.min.quantum = 512/48000
    pulse.min.frag    = 512/48000
}
