# A silent node owned by the PipeWire daemon, so a sink still exists while WirePlumber (which owns
# every ALSA node) restarts or crashes, or the sound card drops out. OpenGamepadUI's Godot PulseAudio
# driver reopens its stream whenever the default sink's name changes and ends its audio thread for
# good if that sink is missing, which left the shell silent until the session restarted. With this
# node it moves here and back: sound kept through three WirePlumber restarts (HW, RG 55G1, 2026-11-07).
# Audio/Duplex, not Audio/Sink: wpctl status skips it and OGUI's output menu takes only Audio/Sink.
# Priority 1 keeps it below every real sink and mic; a board with no mic gets it as a silent source.
context.objects = [
    {   factory = adapter
        args = {
            factory.name     = support.null-audio-sink
            node.name        = retroforge-fallback
            node.description = "Fallback"
            media.class      = Audio/Duplex
            audio.position   = [ FL FR ]
            priority.session = 1
            priority.driver  = 1
        }
    }
]
