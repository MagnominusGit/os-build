# HiFi verb for the MANGMI Air Y (SM6115). Audio paths (ROCKNIX HiFi-MangmiAirY.conf):
#   Speaker:     MM1 -> SEC_MI2S_RX        -> one AW88261 amp (stereo stream) (playback PCM 0)
#   Headphones:  MM2 -> QUAT_MI2S_RX (SD0) -> ES8326                 (playback PCM 1)
#   Mic:         MM4 <- VA_CODEC_DMA_TX_0  <- VA macro DEC0+DEC1 <- DMIC2 (capture PCM 3)
#   Headset Mic: MM5 <- QUAT_MI2S_TX (SD1) <- ES8326 ADC             (capture PCM 4)
# PCM numbers are the topology's front-end ids (MultiMedia1 = 0); the captures are stereo, as
# ROCKNIX's AudioReach profile has them.

# Every front end is routed to its back end here, in the verb, capture included. PipeWire's ACP
# probes a profile by setting the verb and opening each mapping's PCM WITHOUT running the device
# EnableSequences, and a DPCM MultiMedia capture PCM with no back end routed fails to open
# (EINVAL, "no backend DAIs enabled for MultiMedia5 Capture"). Both HiFi profiles carry the Headset
# Mic, so with the capture routes only in the devices every profile was rejected and PipeWire fell
# back to a Dummy Output: no sound at all on the Air X's first boot (2026-10-11). The devices keep
# only the codec-side switches and muxes.
SectionVerb {
	EnableSequence [
		cset "name='SEC_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='QUAT_MI2S_RX Audio Mixer MultiMedia2' 1"
		cset "name='MultiMedia4 Mixer VA_CODEC_DMA_TX_0' 1"
		cset "name='MultiMedia5 Mixer QUAT_MI2S_TX' 1"
	]

	DisableSequence [
		cset "name='SEC_MI2S_RX Audio Mixer MultiMedia1' 0"
		cset "name='QUAT_MI2S_RX Audio Mixer MultiMedia2' 0"
		cset "name='MultiMedia4 Mixer VA_CODEC_DMA_TX_0' 0"
		cset "name='MultiMedia5 Mixer QUAT_MI2S_TX' 0"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker Playback"

	ConflictingDevice [
		"Headphones"
	]

	# The amp profile and gain used to sit in ROCKNIX's BootSequence; nothing on the shipped
	# image executes one (see the Pocket Max profile), so they live here, where ACP applies
	# them when it selects the route.
	EnableSequence [
		cset "name='SPK_L Profile Set' 0"
		cset "name='SPK_L PCM Playback Volume' 360"
	]

	DisableSequence [
		cset "name='SPK_L PCM Playback Volume' 0"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
		PlaybackRate 48000
		PlaybackMixer "default:${CardId}"
	}
}

SectionDevice."Headphones" {
	Comment "Headphone Playback (ES8326)"

	ConflictingDevice [
		"Speaker"
	]

	EnableSequence [
		cset "name='HPVol SPKVol Switch' 1"
		cset "name='Headphones Playback Volume' 120"
	]

	DisableSequence [
		cset "name='Headphones Playback Volume' 0"
	]

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},1"
		PlaybackChannels 2
		PlaybackRate 48000
		PlaybackVolume "Headphones Playback Volume"
		JackControl "Headphone Jack"
		JackHWMute "Speaker"
	}
}

SectionDevice."Mic" {
	Comment "Built-in microphone (DMIC2 via bolero VA macro)"

	EnableSequence [
		cset "name='VA DEC0 MUX' VA_DMIC"
		cset "name='VA DMIC MUX0' DMIC2"
		cset "name='VA_AIF1_CAP Mixer DEC0' 1"
		cset "name='VA DEC1 MUX' VA_DMIC"
		cset "name='VA DMIC MUX1' DMIC2"
		cset "name='VA_AIF1_CAP Mixer DEC1' 1"
	]

	DisableSequence [
		cset "name='VA_AIF1_CAP Mixer DEC0' 0"
		cset "name='VA_AIF1_CAP Mixer DEC1' 0"
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},3"
		CaptureChannels 2
		CaptureRate 48000
	}
}

SectionDevice."Headset Mic" {
	Comment "Headset microphone (ES8326 via QUAT_MI2S_TX)"

	EnableSequence [
		cset "name='ALC Capture Switch' 1"
		cset "name='ADC PGA SE Switch' 1"
		cset "name='ADC Capture Volume' 200,200"
	]

	DisableSequence [
		cset "name='ALC Capture Switch' 0"
	]

	Value {
		CapturePriority 200
		CapturePCM "hw:${CardId},4"
		CaptureChannels 2
		CaptureRate 48000
		JackControl "Mic Jack"
	}
}
