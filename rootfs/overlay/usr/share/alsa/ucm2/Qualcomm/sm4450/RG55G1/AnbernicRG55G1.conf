# Use case configuration for the Anbernic RG 55G1
#
# Two awinic aw88166 speaker amps on SENARY MI2S, headphones on the wcd937x over SoundWire.
# From ROCKNIX's SM4450 card config. Changed here: no 'Speaker Volume' remap onto the amps' 'PCM
# Playback Volume' and no boot value for it. ROCKNIX's 511 means 0 dB under its aw88166 patch 0034,
# which RetroForge does not carry (it inverts that control on every aw88166 board); under the
# driver we ship, the default 0 already is full scale. The speaker is software-volume, as on the
# Odin 3.

Syntax 4

SectionUseCase."HiFi" {
	File "/Qualcomm/sm4450/RG55G1/HiFi.conf"
	Comment "HiFi quality Music."
}

BootSequence [
	cset "name='RX_RX0 Digital Volume' 84"
	cset "name='RX_RX1 Digital Volume' 84"
	cset "name='HPHL Volume' 20"
	cset "name='HPHR Volume' 20"
	cset "name='ADC2 Volume' 10"
]

LibraryConfig.remap.Config {

	ctl.default.map {
		"name='HP Volume'" {
			"name='HPHL Volume'".vindex.0 0
			"name='HPHR Volume'".vindex.1 0
		}
	}
}

Include.card-init.File "/lib/card-init.conf"
Include.ctl-remap.File "/lib/ctl-remap.conf"
Include.wcd-init.File "/codecs/wcd937x/init.conf"
