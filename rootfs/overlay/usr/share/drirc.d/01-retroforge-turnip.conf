<?xml version="1.0"?>
<!--
  retroforge additions to mesa's 00-turnip-defaults.conf (mesa reads every file in drirc.d, in order).

  heap_memory_percent: the device heap Turnip reports, as a share of RAM. Mesa's default is 75%;
  Valve ships 15/16 for every app on the Steam Frame (its 26.3 turnip defaults). The VRAM an
  emulator actually gets to plan around is capped separately: retroforge-launch enables the
  vram-report-limit layer at 4096 MiB for emulators, as Valve does for its games.

  tu_autotune_flags: adapt corrects the GMEM/sysmem time model from measured render pass times
  (mesa patch 0018). TU_AUTOTUNE_FLAGS in the environment replaces it.
-->
<driconf>
    <device driver="turnip">
        <application name="all-default">
            <!-- 15/16 -->
            <option name="heap_memory_percent" value="0.9375"/>
            <option name="tu_autotune_flags" value="adapt"/>
        </application>
    </device>
</driconf>
