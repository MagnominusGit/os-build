# The player's folders: ROMs, BIOS, saves and save states, one subfolder per system, plus the
# emulators the RetroForge plugin downloads. Also what the Samba shares expose.
#
# USER tmpfiles, run by player's own user manager at every login (systemd-tmpfiles-setup.service in
# the user's basic.target -- enabled by /etc/systemd/user/basic.target.wants, because user presets
# are only applied at package install time, which an image build never runs): /home is certainly mounted by then (the system-wide tmpfiles.d is not
# ordered after it — /home is `nofail` in fstab), the folders come out owned by player, and a
# device updated over OTA, which keeps its /home, still gains the folders a newer image adds.
#
# <system> is the key in /etc/retroforge/launch.conf and the ROM card's first argument; every system
# there needs its roms/bios/saves/states row here (tests/test-launch.sh checks): BIOS files are per
# system too, so two emulators never look through each other's (a PS2 BIOS set beside PS1 ones). An emulator's seed in
# /usr/share/retroforge/emulators/ points its BIOS, memory card and save-state folders at these.
d %h/roms           0755 - - -
d %h/roms/psx       0755 - - -
d %h/roms/ps2       0755 - - -
d %h/roms/gc        0755 - - -
d %h/roms/wii       0755 - - -
d %h/roms/gb        0755 - - -
d %h/roms/gbc       0755 - - -
d %h/roms/gba       0755 - - -
d %h/roms/snes      0755 - - -
d %h/roms/psp       0755 - - -
d %h/roms/md        0755 - - -
d %h/roms/segacd    0755 - - -
d %h/roms/dc        0755 - - -
d %h/roms/nds       0755 - - -
d %h/roms/3ds       0755 - - -
d %h/roms/wiiu      0755 - - -
d %h/roms/xbox      0755 - - -
d %h/roms/ps3       0755 - - -
# PortMaster (a download from Settings > Emulators) lives in roms/ports/PortMaster and installs
# its ports beside it, each with its own launch script: PortMaster's generic default, reached
# through the image's /roms -> /home/player/roms symlink. No bios/saves/states: ports keep their
# data in their own folders.
d %h/roms/ports     0755 - - -
d %h/bios           0755 - - -
d %h/bios/psx       0755 - - -
d %h/bios/ps2       0755 - - -
d %h/bios/gc        0755 - - -
d %h/bios/wii       0755 - - -
d %h/bios/gb        0755 - - -
d %h/bios/gbc       0755 - - -
d %h/bios/gba       0755 - - -
d %h/bios/snes      0755 - - -
d %h/bios/psp       0755 - - -
d %h/bios/md        0755 - - -
d %h/bios/segacd    0755 - - -
d %h/bios/dc        0755 - - -
d %h/bios/nds       0755 - - -
d %h/bios/3ds       0755 - - -
d %h/bios/wiiu      0755 - - -
d %h/bios/xbox      0755 - - -
d %h/bios/ps3       0755 - - -
d %h/saves          0755 - - -
d %h/saves/psx      0755 - - -
d %h/saves/ps2      0755 - - -
d %h/saves/gc       0755 - - -
d %h/saves/wii      0755 - - -
d %h/saves/gb       0755 - - -
d %h/saves/gbc      0755 - - -
d %h/saves/gba      0755 - - -
d %h/saves/snes     0755 - - -
d %h/saves/psp      0755 - - -
d %h/saves/md       0755 - - -
d %h/saves/segacd   0755 - - -
d %h/saves/dc       0755 - - -
d %h/saves/nds      0755 - - -
d %h/saves/3ds      0755 - - -
d %h/saves/wiiu     0755 - - -
d %h/saves/xbox     0755 - - -
d %h/saves/ps3      0755 - - -
d %h/states         0755 - - -
d %h/states/psx     0755 - - -
d %h/states/ps2     0755 - - -
d %h/states/gc      0755 - - -
d %h/states/wii     0755 - - -
d %h/states/gb      0755 - - -
d %h/states/gbc     0755 - - -
d %h/states/gba     0755 - - -
d %h/states/snes    0755 - - -
d %h/states/psp     0755 - - -
d %h/states/md      0755 - - -
d %h/states/segacd  0755 - - -
d %h/states/dc      0755 - - -
d %h/states/nds     0755 - - -
d %h/states/3ds     0755 - - -
d %h/states/wiiu    0755 - - -
d %h/states/xbox    0755 - - -
d %h/states/ps3     0755 - - -
d %h/emulators      0755 - - -

# Emulators whose folders have no setting, linked into the shared layout instead (an `L` never
# replaces what is already there, so a player's own folder or link is kept):
# - Azahar (3DS) moves its SD card and NAND (game saves) to ~/saves/3ds/{sdmc,nand} only if those
#   folders already exist when it starts; otherwise it silently keeps ~/.local/share/azahar-emu.
d %h/saves/3ds/sdmc 0755 - - -
d %h/saves/3ds/nand 0755 - - -
# - PPSSPP (PSP) keeps saves and states on its memory stick, ~/.config/ppsspp/PSP, with no setting.
d %h/.config/ppsspp/PSP 0755 - - -
L %h/.config/ppsspp/PSP/SAVEDATA - - - - %h/saves/psp
L %h/.config/ppsspp/PSP/PPSSPP_STATE - - - - %h/states/psp
# - RPCS3 (PS3) keeps its internal drive (saves, installed updates and DLC) in ~/saves/ps3/dev_hdd0
#   (its vfs.yml seed), but refuses a folder that does not exist yet: "Cannot use ... for Virtual
#   File System because it does not exist" (HW 2026-10-07).
d %h/saves/ps3/dev_hdd0 0755 - - -
# - ClownMDEmu (Mega Drive, Mega CD) keeps saves in "Save Data" beside its configuration.ini, in
#   the user folder its -u names (~/.config/clownmdemu/<system>), with no setting of their own.
d %h/.config/clownmdemu/md 0755 - - -
d %h/.config/clownmdemu/segacd 0755 - - -
L "%h/.config/clownmdemu/md/Save Data" - - - - %h/saves/md
L "%h/.config/clownmdemu/segacd/Save Data" - - - - %h/saves/segacd
# - Cemu (Wii U) reads its disc keys only from ~/.local/share/Cemu/keys.txt.
d %h/.local/share/Cemu 0755 - - -
L %h/.local/share/Cemu/keys.txt - - - - %h/bios/wiiu/keys.txt
