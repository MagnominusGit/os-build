; RetroForge first-run settings for DuckStation. retroforge-launch copies this to
; ~/.local/share/duckstation/settings.ini only when that file does not exist, so
; whatever the player changes in DuckStation afterwards is kept.
;
; Every handheld reaches emulators as ONE controller: InputPlumber turns each
; device's joypad into a virtual Xbox Elite pad (/etc/inputplumber/devices.d),
; which SDL sees as SDL-0. So this mapping is the same on every device.
;
; Only what RetroForge decides is here; DuckStation's own defaults cover the rest
; (it keeps them in memory and never writes them back into this file).
; - SetupWizardIncomplete = false: without it the setup wizard opens before the
;   game. Skipping it also skips its controller auto-map, hence [Pad1] below.
; - SaveStateOnExit = true: a resume state in ~/states/psx when the game is
;   closed, including by OpenGamepadUI's Exit (SIGTERM). Off by default: a long
;   session left only the memory card (HW 2026-10-03).
; - AutoUpdater off: RetroForge pins the version; DuckStation must not offer its own.
; - ConfirmPowerOff = false: quitting from DuckStation's own menu never asks,
;   but a SIGTERM does (OpenGamepadUI's Exit, a session stop): "are you sure?"
;   then waits on a dialog nobody answers, until it is killed (HW 2026-10-03).
; - Not needed (tested): StartFullscreen (retroforge-launch passes -fullscreen),
;   EnableDiscordPresence.
; - OpenPauseMenu: DuckStation binds its menu to keyboard Escape only, so a
;   controller could never reach Exit. Select + Start opens it.
; - Guide stays unbound: OpenGamepadUI owns it.
; - Memory cards and save states go to the shared layout (~/saves/psx,
;   ~/states/psx: usr/share/user-tmpfiles.d/retroforge-home.conf), not
;   DuckStation's private ~/.local/share/duckstation, so they are backed up and
;   reachable over the network share with the ROMs.
; HW-verified on the MANGMI Pocket Max, 2026-10-03.

[Main]
SetupWizardIncomplete = false
ConfirmPowerOff = false
SaveStateOnExit = true

[AutoUpdater]
CheckAtStartup = false

[BIOS]
SearchDirectory = /home/player/bios/psx

[GameList]
RecursivePaths = /home/player/roms/psx

[MemoryCards]
Directory = /home/player/saves/psx

[Folders]
SaveStates = /home/player/states/psx

[GPU]
Renderer = Vulkan

[InputSources]
SDL = true

[Pad1]
Type = AnalogController
Up = SDL-0/DPadUp
Right = SDL-0/DPadRight
Down = SDL-0/DPadDown
Left = SDL-0/DPadLeft
Triangle = SDL-0/Y
Circle = SDL-0/B
Cross = SDL-0/A
Square = SDL-0/X
Select = SDL-0/Back
Start = SDL-0/Start
L1 = SDL-0/LeftShoulder
R1 = SDL-0/RightShoulder
L2 = SDL-0/+LeftTrigger
R2 = SDL-0/+RightTrigger
L3 = SDL-0/LeftStick
R3 = SDL-0/RightStick
LLeft = SDL-0/-LeftX
LRight = SDL-0/+LeftX
LDown = SDL-0/+LeftY
LUp = SDL-0/-LeftY
RLeft = SDL-0/-RightX
RRight = SDL-0/+RightX
RDown = SDL-0/+RightY
RUp = SDL-0/-RightY
SmallMotor = SDL-0/SmallMotor
LargeMotor = SDL-0/LargeMotor

[Hotkeys]
OpenPauseMenu = SDL-0/Back & SDL-0/Start
