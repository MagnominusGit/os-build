; RetroForge first-run settings for mGBA (Game Boy, Game Boy Color, Game Boy Advance). retroforge-launch
; copies this to ~/.config/mgba/config.ini only when that file does not exist. mGBA rewrites the
; file when it saves its settings (these comments go, the keys stay). Only what RetroForge decides is
; here; mGBA's defaults cover the rest.
; - BIOS: mGBA takes file paths, not folders: these are its own default file names, in the shared
;   flat ~/bios folder. A missing file is fine: GBA runs on mGBA's built-in BIOS, GB/GBC boot
;   without a boot ROM.
; - savegamePath/savestatePath: for games opened from mGBA's own window (Main menu > Emulators >
;   Open). Games started from a card get their system's folders from retroforge-launch (-C).
; - fullscreen = 1: Open fills the panel too.
; - updateAutoCheck = 0, useDiscordPresence = 0: already mGBA's defaults; pinned (RetroForge ships the
;   version).
; - [gba.input.SDLB]: the pad, picked as the first SDL joystick and bound by RAW index (no name, no
;   GUID; without this section mGBA binds no button at all). Used for GB and GBC too. InputPlumber's
;   virtual Xbox Elite pad: b0 south, b1 east, b6 Select, b7 Start, b4 LB, b5 RB; hat 0 D-pad; a0/a1
;   left stick (up negative); a3/a4 right stick. GBA/GB A and B follow their POSITIONS: A (right)
;   on east, B (left/bottom) on south -- as mGBA's own Xbox profile does, not the Xbox labels.
;   hat0<dir> = mGBA key id (A0 B1 Select2 Start3 Right4 Left5 Up6 Down7). D-pad also on the left
;   stick. Tilt-sensor games read the right stick, not mGBA's default axes 2/3 (LT rests at its
;   minimum and would read as a permanent tilt). Guide stays unbound: OpenGamepadUI owns it.

[ports.qt]
gba.bios=/home/player/bios/gba_bios.bin
gb.bios=/home/player/bios/gb_bios.bin
sgb.bios=/home/player/bios/sgb_bios.bin
gbc.bios=/home/player/bios/gbc_bios.bin
savegamePath=/home/player/saves/gba
savestatePath=/home/player/states/gba
fullscreen=1
updateAutoCheck=0
useDiscordPresence=0

[gba.input.SDLB]
keyA=1
keyB=0
keySelect=6
keyStart=7
keyL=4
keyR=5
hat0Up=6
hat0Right=4
hat0Down=7
hat0Left=5
axisLeftAxis=-0
axisLeftValue=-16384
axisRightAxis=+0
axisRightValue=16384
axisUpAxis=-1
axisUpValue=-16384
axisDownAxis=+1
axisDownValue=16384
tiltAxisX=3
tiltAxisY=4
