# RetroForge first-run settings for armGBA (Game Boy, Game Boy Color, Game Boy Advance). retroforge-launch
# copies this to ~/.config/armgba/frontend.cfg only when that file does not exist. armGBA rewrites the
# file whenever a setting changes and on quit (these comments go, the keys stay). Only what RetroForge
# decides is here; armGBA's defaults cover the rest (Nintendo button layout: A on the east button, B on
# the south one; VSync on; sharp pixels; no auto save state).
# - bios_folder: the shared flat ~/bios. armGBA looks for gba_bios.bin, gb_bios.bin and gbc_bios.bin
#   there and falls back to its own built-in BIOS and boot ROMs, so a missing file is fine.
# - save_folder/state_folder: armGBA has ONE save and ONE state folder, no per-launch override, so
#   retroforge-launch rewrites these two lines to the card's system before every game
#   (emulator.json system_settings: ~/saves/<system>, ~/states/<system>). The gba values here are
#   for Main menu > Emulators > Open, which has no system. Saves are <game>.srm, as RetroArch names
#   them (mGBA's <game>.sav holds the same bytes: rename to .srm to keep it).
# - fullscreen: Open fills the panel too (a game also gets --fullscreen).
# - hotkeypad = 4: the Hotkey is Select (SDL_CONTROLLER_BUTTON_BACK). armGBA's Auto would pick Home
#   (Guide), which OpenGamepadUI owns and never passes on. Select alone is still the game's Select;
#   with it held, Start pressed twice quits, North opens armGBA's menu, R and L save and load a
#   state, R2 toggles fast-forward, L2 rewinds, West shows the frame rate (ROCKNIX's layout, the
#   defaults; each can be changed in the menu). No single-button quit (user 2026-10-06).
fullscreen = true
bios_folder = "/home/player/bios"
save_folder = "/home/player/saves/gba"
state_folder = "/home/player/states/gba"
hotkeypad = 4
