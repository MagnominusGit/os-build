# RetroForge first-run settings for RPCS3. retroforge-launch copies this to ~/.config/rpcs3/config.yml only
# when it does not exist; RPCS3 applies it over its own defaults (Vulkan renderer included) and only
# rewrites it when the player saves in its settings dialog.
# - Start games in fullscreen mode: RPCS3's default already; pinned so the game fills the panel
#   even without --fullscreen (Open's Big Picture Mode).
# - Exit RPCS3 when process finishes: leaving Big Picture Mode or stopping a game quits RPCS3, so
#   OpenGamepadUI gets the panel back (with --no-gui it quits anyway).
# - Pause Emulation During Home Menu: Select + Start (the PS button, Default.yml) opens RPCS3's home
#   menu (Resume, Savestates, Settings, Exit Game); the game pauses behind it.
Miscellaneous:
  Start games in fullscreen mode: true
  Exit RPCS3 when process finishes: true
  Pause Emulation During Home Menu: true
