; RetroForge first-run GUI settings for RPCS3 (~/.config/rpcs3/GuiConfigs/CurrentSettings.ini; RPCS3
; rewrites this file at its first start, so these comments do not survive).
; - infoBoxEnabledWelcome=false: the welcome dialog opens even with --no-gui, before the game, and
;   closing it quits RPCS3 (gui_application.cpp).
; - confirmationBoxExitGame=false: no "Exit Game?" box when the game window is closed.
; - checkUpdateStart=false: no update check when the main window opens: RetroForge pins the version.
; - useRichPresence=false: no Discord.
; - [Shortcuts]: the Guide-modifier hotkeys. The combination lives in InputPlumber
;   (guide-hotkeys.yaml next to emulator.json): holding Guide turns L1/R1/R2/Start into keyboard
;   F1-F4, and these rows bind those keys to game-window shortcuts. Key names and actions:
;   rpcs3qt/shortcut_settings.cpp (shortcut_info names, section gui::sc) and gs_frame.cpp
;   handle_shortcut, RPCS3 build 1b90d1c1. game_window_savestate_1 reboots the game from its most
;   recent savestate (boot_current_game_savestate); game_window_savestate saves one (Emu.Kill with
;   savestate, then resumes from it; RPCS3 keeps the newest 4); game_window_frame_limit toggles the
;   frame limit ("boost mode", a toggle: no hold fast-forward exists); game_window_stop is
;   Emu.GracefulShutdown with autoexit (unbound by default), so --no-gui quits RPCS3. The defaults
;   these replace (Ctrl+S, Alt+Ctrl+1, Ctrl+F10) are gone with them; nothing else sits on F1-F4.
[main_window]
infoBoxEnabledWelcome=false
confirmationBoxExitGame=false

[Meta]
checkUpdateStart=false
useRichPresence=false

[Shortcuts]
game_window_savestate_1=F1
game_window_savestate=F2
game_window_frame_limit=F3
game_window_stop=F4
