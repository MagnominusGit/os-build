# yaml-language-server: $schema=https://raw.githubusercontent.com/ShadowBlip/InputPlumber/main/rootfs/usr/share/inputplumber/schema/device_profile_v1.json
#
# Guide-modifier hotkeys for melonDS. Same design as snes9x/guide-hotkeys.yaml (the testbed; its
# header explains the Guide row, the deferred ui_guide tap, the explicit target_devices and why R2
# appears twice); only the layer's keyboard outputs differ.
#
# Hold Guide: L1 loads state slot 1, R1 saves it, R2 fast-forwards (held), Start quits; L2 swaps
# the screens (F11), Y swaps which one is drawn large (Home), R3 is the microphone, held (End).
# Mic and swap used to sit on L3/R3 alone, too easy to click by mistake. melonDS's
# save/load/quit are FIXED menu shortcuts (Window.cpp), not bindable, so the layer sends those keys
# as combos: F1 (Load state > 1), Shift+F1 (Save state > 1), Ctrl+Q (File > Quit, QKeySequence::Quit,
# melonDS's normal exit). Targets go out in list order on press and on release, so the modifier is
# down before the key. Fast-forward is F10, bound to HK_FastForward in the seeded melonDS.toml
# [Instance0.Keyboard] (F1-F8 are the state slots; F10 is free).
version: 1
kind: DeviceProfile
name: RetroForge Guide hotkeys (melonDS)
description: Hold Guide for emulator hotkeys; plain pad otherwise
target_devices:
  - xbox-elite
  - keyboard
  - mouse

mapping:
  - name: Guide holds the hotkey layer (and goes to the shell's menu over DBus)
    source_event:
      gamepad:
        button: Guide
    target_events:
      - layer:
          name: guide
      - dbus: ui_guide

layers:
  - name: guide
    mapping:
      - name: Guide+L1 -> F1 (Load state > 1)
        source_event:
          gamepad:
            button: LeftBumper
        target_events:
          - keyboard: KeyF1

      - name: Guide+R1 -> Shift+F1 (Save state > 1)
        source_event:
          gamepad:
            button: RightBumper
        target_events:
          - keyboard: KeyLeftShift
          - keyboard: KeyF1

      - name: Guide+R2 (analog) -> F10 (fast-forward while held)
        source_event:
          gamepad:
            trigger:
              name: RightTrigger
              deadzone: 0.2
        target_events:
          - keyboard: KeyF10

      - name: Guide+R2 (button) -> F10 (fast-forward while held)
        source_event:
          gamepad:
            button: RightTrigger
        target_events:
          - keyboard: KeyF10

      - name: Guide+Start -> Ctrl+Q (File > Quit)
        source_event:
          gamepad:
            button: Start
        target_events:
          - keyboard: KeyLeftCtrl
          - keyboard: KeyQ

      # OpenGamepadUI's own Guide combos, which its intercept used to catch: every gamepad_profile
      # carries them in the layer Guide holds (tests/test-launch.sh checks), so emulators keep A
      # and X free for them. Using them counts as using the layer: no ui_guide tap on release.
      - name: Guide+L2 (analog) -> F11 (swap screens)
        source_event:
          gamepad:
            trigger:
              name: LeftTrigger
              deadzone: 0.2
        target_events:
          - keyboard: KeyF11

      - name: Guide+L2 (button) -> F11 (swap screens)
        source_event:
          gamepad:
            button: LeftTrigger
        target_events:
          - keyboard: KeyF11

      - name: Guide+Y -> Home (swap screen emphasis, which screen is drawn large)
        source_event:
          gamepad:
            button: West
        target_events:
          - keyboard: KeyHome

      - name: Guide+R3 -> End (microphone, held)
        source_event:
          gamepad:
            button: RightStick
        target_events:
          - keyboard: KeyEnd


      - name: Guide+A -> ui_quick (OpenGamepadUI quick bar)
        source_event:
          gamepad:
            button: South
        target_events:
          - dbus: ui_quick

      - name: Guide+X -> ui_osk (OpenGamepadUI on-screen keyboard)
        source_event:
          gamepad:
            button: North
        target_events:
          - dbus: ui_osk
