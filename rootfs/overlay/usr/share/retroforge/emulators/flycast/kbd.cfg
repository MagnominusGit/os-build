; RetroForge first-run keyboard mapping for Flycast, installed as
; ~/.config/flycast/mappings/SDL_Keyboard.cfg: Flycast names it <api>_<device name>.cfg
; (gamepad_device.cpp make_mapping_filename; the SDL keyboard is api "SDL", name "Keyboard" --
; translated by i18n::Ts, so English locale only). With this file present Flycast's built-in keyboard
; defaults (keyboard_device.h KeyboardInputMapping: Tab menu, Space fast-forward, X/C/S/D...) are
; not loaded: a handheld has no keyboard, and only these four keys exist.
; The Guide-modifier hotkeys. The combination lives in InputPlumber (guide-hotkeys.yaml next to
; emulator.json): holding Guide turns L1/R1/R2/Start into keyboard F1-F4. Codes are SDL scancodes
; (F1 58 ... F4 61); action names are mapping.cpp's "emulator" ones, handled in gamepad_device.cpp:
; btn_jump_state loads and btn_quick_save saves the CURRENT state slot (Dreamcast.SavestateSlot, 0
; unless changed in the menu: the slot AutoSaveState also writes on exit), btn_fforward TOGGLES
; fast-forward, btn_escape is dc_exit (the game unloaded as by SIGTERM: resume state and VMU
; written, then Flycast quits).
[emulator]
mapping_name = RetroForge keyboard
version = 4

[digital]
bind0 = 58:btn_jump_state
bind1 = 59:btn_quick_save
bind2 = 60:btn_fforward
bind3 = 61:btn_escape
