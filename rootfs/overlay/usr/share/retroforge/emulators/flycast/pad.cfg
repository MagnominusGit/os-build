; RetroForge first-run Dreamcast controller for Flycast, installed as
; ~/.config/flycast/mappings/SDL_Xbox One Elite 2 Controller.cfg: Flycast picks the file by the SDL
; joystick NAME (sdl2-compat over SDL3 3.4.16 says "Xbox One Elite 2 Controller", as Dolphin's same
; SDL did on hardware). A wrong name falls back to Flycast's own default (playable, but Select alone
; opens the menu and Guide is the arcade Service button). Codes are RAW SDL joystick ones: buttons
; b0 south, b1 east, b2 west, b3 north, b6 Select, b7 Start; axes a0/a1 left stick (up negative),
; a2 LT, a5 RT (triggers rest at the minimum: hence "triggers"); hat 0 as 256 up / 257 down /
; 258 left / 259 right.
; Dreamcast A/B/X/Y by POSITION (A south, B east, X west, Y north); analog L/R on LT/RT.
; Select + Start (any order; [combo] needs version 4) opens Flycast's menu, whose Exit quits back to
; OpenGamepadUI. Guide stays unbound: OpenGamepadUI owns it.
[emulator]
mapping_name = RetroForge
version = 4
triggers = 2,5

[digital]
bind0 = 0:btn_a
bind1 = 1:btn_b
bind2 = 2:btn_x
bind3 = 3:btn_y
bind4 = 7:btn_start
bind5 = 256:btn_dpad1_up
bind6 = 257:btn_dpad1_down
bind7 = 258:btn_dpad1_left
bind8 = 259:btn_dpad1_right

[analog]
bind0 = 0-:axis_left
bind1 = 0+:axis_right
bind2 = 1-:axis_up
bind3 = 1+:axis_down
bind4 = 2+:axis_trigger_left
bind5 = 5+:axis_trigger_right

[combo]
bind0 = 6,7:btn_menu:0
