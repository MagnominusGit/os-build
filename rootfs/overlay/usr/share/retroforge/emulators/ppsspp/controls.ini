; RetroForge first-run controller for PPSSPP: the InputPlumber pad through SDL2's GameController API
; (PPSSPP's own SDL 2.32.8; its bundled gamecontrollerdb maps 045e:0b00 like SDL's xpad
; auto-mapping), device 10 = the first pad (no name, no GUID). SDL buttons become PPSSPP keycodes:
; A 189, B 190, X 191, Y 188, LB 193, RB 192, Back 196, Start 197, D-pad 19 up/20 down/21 left/
; 22 right; axes 4000 + 2*axis (+1 when negative): left stick X 4000/4001, Y 4002 down/4003 up.
; COMPLETE on purpose: when [ControlMapping] exists PPSSPP drops ALL its defaults (KeyMap::LoadFromIni)
; and PPSSPP's own pad defaults leave L/R dead on SDL anyway. ',' separates alternatives, ':' joins
; the keys of a combo.
; PSP buttons by POSITION: Cross south, Circle east, Square west, Triangle north.
; Pause (PPSSPP's pause menu, whose Exit quits with --pause-menu-exit) = Select + Start; Escape (1-111)
; kept for a keyboard. Guide is not bound: OpenGamepadUI owns it (PPSSPP hardwires it to "back" in
; its own menus; nothing in a game).
; Guide-modifier hotkeys: the combination lives in InputPlumber, not here (guide-hotkeys.yaml next to
; emulator.json): holding Guide turns L1/R1/R2/Start into keyboard F1-F4 (device 1 = keyboard,
; NKCODE_F1-F4 = 131-134, Common/Input/KeyCodes.h), and the last four rows bind those keys. Names are
; Core/KeyMap.cpp psp_button_names (v1.20.4): Load State / Save State use the current slot (StateSlot,
; 0 = "slot 1" unless the player picks another); Fast-forward is the hold one; Exit App is
; System_ExitApp, the SDL frontend's clean quit (SDLMain.cpp EXIT_APP), no dialog with
; AskForExitConfirmationAfterSeconds = 0 (ppsspp.ini). PPSSPP's default keyboard map has nothing on
; F1-F4 anyway, and this section replaces it whole.
[ControlMapping]
Up = 10-19
Down = 10-20
Left = 10-21
Right = 10-22
Cross = 10-189
Circle = 10-190
Square = 10-191
Triangle = 10-188
Start = 10-197
Select = 10-196
L = 10-193
R = 10-192
An.Up = 10-4003
An.Down = 10-4002
An.Left = 10-4001
An.Right = 10-4000
Pause = 10-196:10-197,1-111
Load State = 1-131
Save State = 1-132
Fast-forward = 1-133
Exit App = 1-134
