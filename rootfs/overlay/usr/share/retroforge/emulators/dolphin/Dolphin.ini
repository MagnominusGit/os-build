; RetroForge first-run settings for Dolphin. retroforge-launch copies the files in this folder to
; ~/.config/dolphin-emu/ only when they do not exist, so whatever the player changes afterwards is
; kept. Only what RetroForge decides is here; Dolphin's own defaults cover every key left out.
; - ISOPaths: the game list shows ~/roms/gc and ~/roms/wii (Open from Main menu > Emulators).
; - NANDRootPath: the Wii's internal storage, which holds Wii game saves, in ~/saves/wii.
; - GCIFolderAPath: GameCube memory card slot A (a folder card, Dolphin's default type) in
;   ~/saves/gc/<region>. Save states stay in Dolphin's own folder (user decision 2026-10-05):
;   Dolphin has no setting for it, and no save-state-on-exit either.
; - GFXBackend = Vulkan: Dolphin's Linux default is OpenGL.
; - ConfirmStop = False: no "are you sure?" when the game is stopped, including by OpenGamepadUI's
;   Exit (SIGTERM).
; - CursorVisibility = 0: never show the mouse cursor over the game.
; - Analytics: asked and declined, so Dolphin never opens its opt-in dialog.
; - Fullscreen: the game fills the panel (with -b there is no main window).

[General]
ISOPaths = 2
ISOPath0 = /home/player/roms/gc
ISOPath1 = /home/player/roms/wii
NANDRootPath = /home/player/saves/wii

[Core]
GFXBackend = Vulkan
GCIFolderAPath = /home/player/saves/gc

[Interface]
ConfirmStop = False
CursorVisibility = 0

[Display]
Fullscreen = True

[Analytics]
PermissionAsked = True
Enabled = False
