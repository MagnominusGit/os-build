; RetroForge first-run hotkeys for Dolphin: Select + Start stops the game, as it opens the pause menu
; in DuckStation and ARMSX2 (Dolphin has no pad menu; with -b, stopping returns to OpenGamepadUI).
; The file existing means Dolphin applies NONE of its own default hotkeys (InputConfig.cpp only
; calls LoadDefaults with no file; a key missing here is unbound), so its F1-F8 load / Shift+F1-F8
; save defaults are gone and F1-F4 below collide with nothing.
; Guide-modifier hotkeys: the combination lives in InputPlumber (guide-hotkeys.yaml next to
; emulator.json): holding Guide turns L1/R1/R2/Start into keyboard F1-F4, bound here to slot 1
; load / save, the speed limit off while held (HotkeyScheduler.cpp reads it held) and Stop (with
; -b, Dolphin quits). Names are "<group>/<label>" from HotkeyManager.cpp (2609). The keys are not on
; the pad, so each names its device: the X server's master keyboard, which Dolphin's XInput2
; backend calls after the master pointer (XInput2.cpp), "XInput2/0/Virtual core pointer".
[Hotkeys]
Device = SDL/0/Xbox One Elite 2 Controller
General/Stop = @(Back+Start) | `XInput2/0/Virtual core pointer:F4`
Load State/Load State Slot 1 = `XInput2/0/Virtual core pointer:F1`
Save State/Save State Slot 1 = `XInput2/0/Virtual core pointer:F2`
Emulation Speed/Disable Emulation Speed Limit = `XInput2/0/Virtual core pointer:F3`
