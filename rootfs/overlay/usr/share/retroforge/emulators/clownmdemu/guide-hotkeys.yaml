# yaml-language-server: $schema=https://raw.githubusercontent.com/ShadowBlip/InputPlumber/main/rootfs/usr/share/inputplumber/schema/device_profile_v1.json
#
# Guide-modifier hotkeys for ClownMDEmu. Same design as snes9x/guide-hotkeys.yaml (the testbed; its
# header explains the Guide row, the deferred ui_guide tap, the explicit target_devices and why R2
# appears twice); only the layer's keyboard outputs are bound elsewhere.
#
# Hold Guide: L1 quick load, R1 quick save (one RAM snapshot per game session, ClownMDEmu's only
# quick state), R2 fast-forward while held (as RT alone). The layer emits keyboard F1-F3; the seeded
# configuration.ini [Keyboard Bindings] binds them (58/59/60 = INPUT_BINDING_QUICK_LOAD_STATE,
# _QUICK_SAVE_STATE, _FAST_FORWARD, source/frontend.cpp). No Guide+Start row: ClownMDEmu has no quit
# binding (File > Exit and the window's close only), so Start stays the game's own and OpenGamepadUI's
# Exit (SIGTERM -> SDL quit event -> the normal exit) is the way out.
version: 1
kind: DeviceProfile
name: RetroForge Guide hotkeys (ClownMDEmu)
description: Hold Guide for emulator hotkeys; plain pad otherwise
target_devices:
  - xbox-elite
  - keyboard
  - mouse

mapping:
  - name: Guide holds the hotkey layer (and goes to the shell's menu over DBus)
    source_event:
      gamepad:
        button: Guide
    target_events:
      - layer:
          name: guide
      - dbus: ui_guide

layers:
  - name: guide
    mapping:
      - name: Guide+L1 -> F1 (quick load)
        source_event:
          gamepad:
            button: LeftBumper
        target_events:
          - keyboard: KeyF1

      - name: Guide+R1 -> F2 (quick save)
        source_event:
          gamepad:
            button: RightBumper
        target_events:
          - keyboard: KeyF2

      - name: Guide+R2 (analog) -> F3 (fast-forward while held)
        source_event:
          gamepad:
            trigger:
              name: RightTrigger
              deadzone: 0.2
        target_events:
          - keyboard: KeyF3

      - name: Guide+R2 (button) -> F3 (fast-forward while held)
        source_event:
          gamepad:
            button: RightTrigger
        target_events:
          - keyboard: KeyF3

      # OpenGamepadUI's own Guide combos, which its intercept used to catch: every gamepad_profile
      # carries them in the layer Guide holds (tests/test-launch.sh checks), so emulators keep A
      # and X free for them. Using them counts as using the layer: no ui_guide tap on release.
      - name: Guide+A -> ui_quick (OpenGamepadUI quick bar)
        source_event:
          gamepad:
            button: South
        target_events:
          - dbus: ui_quick

      - name: Guide+X -> ui_osk (OpenGamepadUI on-screen keyboard)
        source_event:
          gamepad:
            button: North
        target_events:
          - dbus: ui_osk
