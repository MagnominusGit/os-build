; RetroForge first-run settings for Azahar 2126.1.2. retroforge-launch copies this to
; ~/.config/azahar-emu/qt-config.ini only when that file does not exist. Azahar rewrites the whole
; file (all defaults, no comments) at its first start; the keys below are kept. Only what RetroForge
; decides is here.
; - Controls: ONE profile, every binding "api:controller" + "maptype:all": SDL's GAMEPAD positions on
;   whichever pad is connected, never a GUID (Azahar has no fallback for a GUID that does not match:
;   the binding is just dead). input_maptype=0 (AllControllers) keeps that if the player re-saves
;   from the Controls dialog. SDL2 gamepad numbers: buttons A0 B1 X2 Y3 Back4 Guide5 Start6 L3 7
;   R3 8 LB9 RB10 D-pad 11 up/12 down/13 left/14 right; axes LX0 LY1 RX2 RY3 LT4 RT5.
;   3DS A/B/X/Y by POSITION (A east, B south, X north, Y west), as Azahar's own auto-map does. D-pad
;   from the gamepad's dpad buttons (a raw hat binding misses diagonals). ZL/ZR on the analog
;   triggers. Circle Pad on the left stick, C-Stick on the right. Home stays on the keyboard: Guide
;   is OpenGamepadUI's. Values holding commas MUST be quoted (QSettings would read a list).
; - Shortcuts (controller, "a||b" = both held): Select + Start = "Exit Azahar" (quits; Azahar has no
;   pad menu). L3 cycles the screen layouts, R3 swaps the screens (which one is big, or shown).
; - confirmClose=false: no "Would you like to exit now?" on that exit.
; - saveStateWarning=false: no modal warning at the first save-state load.
; - hideInactiveMouse: no cursor over the game. gameListRootDir: Open's game list shows ~/roms/3ds.
; - Data Storage: the emulated SD card and NAND (game saves, extdata, installed titles) in
;   ~/saves/3ds/{sdmc,nand}. Those folders must exist before Azahar starts, or it silently keeps
;   ~/.local/share/azahar-emu (retroforge-home.conf makes them). Save states have no setting (they stay
;   in ~/.local/share/azahar-emu/states).
; - Layout: one landscape panel: a large top screen with the touch screen at half size bottom right
;   (1371x823 + 549x411 on 1920x1080); L3 cycles large / single screen (fullscreen; R3 picks top or
;   bottom) / side by side / stacked -- never "separate windows", a second window under gamescope.
; - Renderer: Vulkan (Turnip) instead of the Linux default OpenGL; 2x internal resolution.
; Not needed (not compiled in, or already the default): update check, Discord, telemetry, CPU JIT.

[Controls]
profile=0
profiles\size=1
profiles\1\name=Default
profiles\1\input_maptype=0
profiles\1\button_a="engine:sdl,api:controller,maptype:all,button:1"
profiles\1\button_b="engine:sdl,api:controller,maptype:all,button:0"
profiles\1\button_x="engine:sdl,api:controller,maptype:all,button:3"
profiles\1\button_y="engine:sdl,api:controller,maptype:all,button:2"
profiles\1\button_up="engine:sdl,api:controller,maptype:all,button:11"
profiles\1\button_down="engine:sdl,api:controller,maptype:all,button:12"
profiles\1\button_left="engine:sdl,api:controller,maptype:all,button:13"
profiles\1\button_right="engine:sdl,api:controller,maptype:all,button:14"
profiles\1\button_l="engine:sdl,api:controller,maptype:all,button:9"
profiles\1\button_r="engine:sdl,api:controller,maptype:all,button:10"
profiles\1\button_start="engine:sdl,api:controller,maptype:all,button:6"
profiles\1\button_select="engine:sdl,api:controller,maptype:all,button:4"
profiles\1\button_zl="engine:sdl,api:controller,maptype:all,axis:4,direction:+,threshold:0.5"
profiles\1\button_zr="engine:sdl,api:controller,maptype:all,axis:5,direction:+,threshold:0.5"
profiles\1\circle_pad="engine:sdl,api:controller,maptype:all,axis_x:0,axis_y:1"
profiles\1\c_stick="engine:sdl,api:controller,maptype:all,axis_x:2,axis_y:3"

[UI]
confirmClose=false
saveStateWarning=false
hideInactiveMouse=true
Paths\gameListRootDir=/home/player/roms/3ds
Shortcuts\Main%20Window\Exit%20Azahar\controller_keyseq="engine:sdl,api:controller,maptype:all,button:4||engine:sdl,api:controller,maptype:all,button:6"
Shortcuts\Main%20Window\Toggle%20Screen%20Layout\controller_keyseq="engine:sdl,api:controller,maptype:all,button:7"
Shortcuts\Main%20Window\Swap%20Screens\controller_keyseq="engine:sdl,api:controller,maptype:all,button:8"

[Data%20Storage]
use_custom_storage=true
sdmc_directory=/home/player/saves/3ds/sdmc/
nand_directory=/home/player/saves/3ds/nand/

[Layout]
layout_option=2
large_screen_proportion=2
layouts_to_cycle=2, 1, 3, 0

[Renderer]
graphics_api=2
resolution_factor=2
