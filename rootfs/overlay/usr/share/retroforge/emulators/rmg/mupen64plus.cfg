# RetroForge first-run settings for RMG 0.9.0. retroforge-launch copies this to
# ~/.config/RMG/mupen64plus.cfg only when that file does not exist, so whatever the player changes
# in RMG afterwards is kept. Only what RetroForge decides is here; RMG fills in its defaults and
# rewrites the file whole on exit.
# - [Core] SaveSRAMPath/SaveStatePath: the shared layout (~/saves/n64, ~/states/n64).
# - ConfirmExitWhileInGame = False: the "are you sure?" dialog would hang OpenGamepadUI's Exit
#   (SIGTERM), the ARMSX2 ConfirmShutdown lesson.
# - CheckForUpdates = False: RetroForge ships the version (Main menu > Emulators).
# - OpenGLES = True: GLideN64's GLES path, the one every Adreno board has (RMG auto-detected it on
#   HW too; pinned so a desktop-GL default can never come back on a board without GL 3.3).
# - PauseEmulationOnFocusLoss/ResumeEmulationOnFocus = False: under gamescope focus belongs to
#   OpenGamepadUI's window management, not the player; a pause keyed to it is a game that stops
#   when the overlay opens and may never resume. No other emulator pauses on focus loss.
# - [Rosalie's Mupen GUI Core]: the plugin set, pinned so an RMG default change can never flip the
#   video plugin to parallel (paraLLEl-RDP does not run on the A610 boards).
# - RomBrowser Directory: Open's ROM list shows the player's N64 folder.
# - Input Plugin Profile 0 (player 1): without this section RMG-Input reports the controller
#   unplugged (PluggedIn defaults false) -- a fresh install has NO working pad (HW 2026-10-20,
#   Air X). DeviceType = 2 is RMG's Automatic: open_controller_automatic takes the first SDL
#   gamepad, InputPlumber's virtual pad, the only one a RetroForge session shows; no name, path or
#   serial to go stale. Mappings are SDL3 gamepad ids (layout, not hardware): InputType 0 = gamepad
#   button with Data = SDL_GamepadButton, InputType 1 = gamepad axis with Data = SDL_GamepadAxis
#   and ExtraData 1/0 = positive/negative direction. Lists are ';'-separated; several entries on a
#   game button mean any-of (Z on either trigger), on a hotkey all-pressed (a combo).
#   N64 A = south, B = west, C buttons = right stick, Z = either trigger, analog = left stick.
# - Hotkey_Shutdown = Back+Start (Select+Start): stops emulation, and -q then quits RMG, the same
#   one-combo exit as the other emulators. Guide stays OpenGamepadUI's.

[Core]

Version = 1.010000
SaveStatePath = "/home/player/states/n64"
SaveSRAMPath = "/home/player/saves/n64"

[Rosalie's Mupen GUI]

Version = "v0.9.0"
CheckForUpdates = False
ConfirmExitWhileInGame = False
OpenGLES = True
PauseEmulationOnFocusLoss = False
ResumeEmulationOnFocus = False

[Rosalie's Mupen GUI Core]

GFX_Plugin = "mupen64plus-video-GLideN64.so"
AUDIO_Plugin = "RMG-Audio.so"
INPUT_Plugin = "RMG-Input.so"
RSP_Plugin = "mupen64plus-rsp-hle.so"

[Rosalie's Mupen GUI RomBrowser]

Directory = "/home/player/roms/n64"
Recursive = True

