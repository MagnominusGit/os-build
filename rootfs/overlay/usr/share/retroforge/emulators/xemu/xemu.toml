# RetroForge first-run settings for xemu. retroforge-launch copies this to ~/.local/share/xemu/xemu/xemu.toml
# only when it does not exist; xemu fills every other key from its defaults and rewrites the file
# (non-default keys only, no comments) when it exits.
# - show_welcome = false: otherwise the first-boot window opens and the machine does not start.
# - skip_boot_anim: straight into the game.
# - games_dir: the Games list in xemu's menu (Back + Start) shows ~/roms/xbox.
# - renderer VULKAN (Turnip); the default is OpenGL.
# - show_menubar = false: no menu bar over the game.
# - sys.files: the player supplies the MCPX boot ROM and flash BIOS in ~/bios/xbox and xemu's
#   pre-formatted HDD image in ~/saves/xbox (it holds the game saves AND xemu's snapshots, so
#   ~/states/xbox stays empty); the EEPROM is generated there at the first boot.
# - Controller: nothing here. No port binding + auto_bind (the default) puts the one pad on port 1
#   and records its GUID; the keyboard is never bound. xemu's defaults map by position and label
#   alike (A south, B east, X west, Y north, LB White, RB Black, analog triggers). Guide is left out
#   of the SDL mapping in emulator.json. No update check exists on Linux.

[general]
show_welcome = false
skip_boot_anim = true
games_dir = '/home/player/roms/xbox'

[display]
renderer = 'VULKAN'

[display.ui]
show_menubar = false

[sys.files]
bootrom_path = '/home/player/bios/xbox/mcpx_1.0.bin'
flashrom_path = '/home/player/bios/xbox/Complex_4627.bin'
hdd_path = '/home/player/saves/xbox/xbox_hdd.qcow2'
eeprom_path = '/home/player/saves/xbox/eeprom.bin'
