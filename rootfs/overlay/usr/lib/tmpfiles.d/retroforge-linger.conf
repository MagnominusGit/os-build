# Linger for the session user: logind starts player's user manager as logind itself starts, rather
# than when the session's login asks for it. The login waits for that manager (pam_systemd), ~1 s of
# unit loading on the Air X, and this way it is mostly done by then. It stays up across a session
# restart too.
f /var/lib/systemd/linger/player 0644 root root -
