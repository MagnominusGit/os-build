# retroforge — the player's home is the player's alone (0700).
#
# Steam keeps its saved sign-in under ~/.local/share/Steam (local.vdf), and the client writes those
# files readable by everyone. Homes made before image/lib-homestage.sh staged it 0700 were 0755, so
# every other account on the device (avahi, systemd-resolve, systemd-network, ...) could read them.
#
# Nothing else needs into the home: the SMB guests reach roms, bios, saves and states as the player
# (ksmbd.conf's guest account), and every service of another user stays out of it. /home is mounted
# before local-fs.target (retroforge-offload.target), so the line applies on every boot.
z /home/player 0700 player player -
