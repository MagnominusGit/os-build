# retroforge runtime state directory.
#
# 'd' (create if absent), NEVER 'D'. 'D' empties the directory on boot, which would delete
# /run/retroforge/boot -- the handoff the initramfs writes before switch_root recording which A/B
# slot it selected and why. That file is the only evidence of the boot decision, and
# retroforge-bootctl reads it to know which slot it is running on.
#
# It has a SECOND reader now, and one with a wider blast radius: usr/lib/retroforge/on-boot-disk
# takes the boot disk from its root= line for every partition uevent, and /dev/retroforge/* -- which
# is how /esp, /home, grow-home and rauc's slots all name their partitions -- exists because of it.
# Emptying this directory would not break those; it would silently widen them back to "any disk
# with our GPT names", which is the ambiguity they exist to close. See docs/phase5.md.
#
# The session subdir is player-owned so retroforge-session (which runs as player) can create its
# readiness marker there without any privilege: the ESP write stays in a root oneshot.
d /run/retroforge         0755 root root -
d /run/retroforge/session 0755 player player -
