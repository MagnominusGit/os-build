QFORGE_DEVICE_ID=ayn-odin-2-mini
QFORGE_DEVICE_NAME='AYN Odin 2 Mini'
QFORGE_SOC_CLASS=SM8550

QFORGE_PRIMARY_CONNECTOR=DSI-1
QFORGE_PANEL_NATIVE_WIDTH=1080
QFORGE_PANEL_NATIVE_HEIGHT=1920
QFORGE_PANEL_REFRESH_RATES=60
QFORGE_GAMESCOPE_FAKE_OUTPUT_MM=177x100

# Hardware map (hw-map; docs/hardware-map.md has the per-SoC reasoning). Names read off this
# board's DTS and the drivers' naming, cross-checked with ROCKNIX `next`; not yet read off this
# board running QForge, so a wrong one is logged and detected instead.
# Backlight: the odin2miniled controller on i2c0 registers itself under that fixed name; the boe
# panel links none. LEDs: the PM8550 power LED from the shared AYN dtsi (ROCKNIX has no Mini
# quirks to say whether the diode is fitted).
QFORGE_HW_BATTERY=qcom-battmgr-bat
QFORGE_HW_CHARGER=qcom-battmgr-usb
QFORGE_HW_BACKLIGHT=odin2miniled-backlight
QFORGE_HW_THERMAL_CPU=cpu7-top-thermal
QFORGE_HW_THERMAL_GPU=gpuss-0-thermal
QFORGE_HW_FAN=pwmfan
QFORGE_HW_GPU_DEVFREQ=3d00000.gpu
QFORGE_HW_LED_GROUPS="power=power-led"
