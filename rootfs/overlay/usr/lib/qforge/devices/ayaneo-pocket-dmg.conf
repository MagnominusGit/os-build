QFORGE_DEVICE_ID=ayaneo-pocket-dmg
QFORGE_DEVICE_NAME='AYANEO Pocket DMG'
QFORGE_SOC_CLASS=SM8550

QFORGE_PRIMARY_CONNECTOR=DSI-1
QFORGE_PANEL_NATIVE_WIDTH=1080
QFORGE_PANEL_NATIVE_HEIGHT=1240
QFORGE_PANEL_REFRESH_RATES=60
# Near-square panel (1240x1080 logical), so NOT the fleet's 16:9 177x100: same
# declared density (10.8 px/mm on both axes) at this panel's aspect. The real 3.92"
# panel is ~65x75 mm, which the driver declares as 0x0 (kernel patch 0052) — either
# way SteamUI is far too big without this. See the fake-output-mm note in device-env.
QFORGE_GAMESCOPE_FAKE_OUTPUT_MM=115x100
