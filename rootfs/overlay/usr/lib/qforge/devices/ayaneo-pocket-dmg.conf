QFORGE_DEVICE_ID=ayaneo-pocket-dmg
QFORGE_DEVICE_NAME='AYANEO Pocket DMG'
QFORGE_SOC_CLASS=SM8550

QFORGE_PRIMARY_CONNECTOR=DSI-1
QFORGE_PANEL_NATIVE_WIDTH=1080
QFORGE_PANEL_NATIVE_HEIGHT=1240
QFORGE_PANEL_REFRESH_RATES=60
# Near-square panel (1240x1080 logical), so NOT the fleet's 16:9 177x100: same
# declared density (10.8 px/mm on both axes) at this panel's aspect. The real 3.92"
# panel is ~65x75 mm, which the driver declares as 0x0 (kernel patch 0052) — either
# way the UI is far too big without this. See the fake-output-mm note in device-env.
QFORGE_GAMESCOPE_FAKE_OUTPUT_MM=115x100

# Hardware map (hw-map; docs/hardware-map.md has the per-SoC reasoning). Names read off this
# board's DTS and the drivers' naming, cross-checked with ROCKNIX `next`; not yet read off this
# board running QForge, so a wrong one is logged and detected instead.
# Backlight: the panel's own DCS backlight on mdss_dsi0 (no SY7758 on this board). LEDs: the
# PM8550 power LED. The stick RGB rings are the serial MCU's (ROCKNIX writes frames to ttyHS0);
# QForge's ayaneo-serial-mcu driver exposes no LED device for them, so they have no path yet.
QFORGE_HW_BATTERY=qcom-battmgr-bat
QFORGE_HW_CHARGER=qcom-battmgr-usb
QFORGE_HW_BACKLIGHT=ae94000.dsi.0
QFORGE_HW_THERMAL_CPU=cpu7-top-thermal
QFORGE_HW_THERMAL_GPU=gpuss-0-thermal
QFORGE_HW_FAN=pwmfan
QFORGE_HW_GPU_DEVFREQ=3d00000.gpu
QFORGE_HW_LED_GROUPS="power=power-led"
