QFORGE_DEVICE_ID=ayn-odin-2-portal
QFORGE_DEVICE_NAME='AYN Odin 2 Portal'
QFORGE_SOC_CLASS=SM8550

QFORGE_PRIMARY_CONNECTOR=DSI-1
QFORGE_PANEL_NATIVE_WIDTH=1080
QFORGE_PANEL_NATIVE_HEIGHT=1920
QFORGE_PANEL_REFRESH_RATES=60,120
QFORGE_GAMESCOPE_FAKE_OUTPUT_MM=177x100

# Hardware map (hw-map; docs/hardware-map.md has the per-SoC reasoning). Names read off this
# board's DTS and the drivers' naming, cross-checked with ROCKNIX `next`; not yet read off this
# board running QForge, so a wrong one is logged and detected instead.
# Backlight: the icna3512 panel's own DCS backlight, named after its DSI device. The panel is on
# mdss_dsi1 (dsi@ae96000) although its connector is DSI-1, because dsi0 is unused. LEDs: the stick
# rings, four RGB segments a side (leds-group-multicolor over two HTR3212s; multi_index reads
# blue green red). The shared dtsi's power-led also registers, but ROCKNIX drives only the rings
# here, battery status included, so it stays out until a diode is confirmed.
QFORGE_HW_BATTERY=qcom-battmgr-bat
QFORGE_HW_CHARGER=qcom-battmgr-usb
QFORGE_HW_BACKLIGHT=ae96000.dsi.0
QFORGE_HW_THERMAL_CPU=cpu7-top-thermal
QFORGE_HW_THERMAL_GPU=gpuss-0-thermal
QFORGE_HW_FAN=pwmfan
QFORGE_HW_GPU_DEVFREQ=3d00000.gpu
QFORGE_HW_LED_GROUPS="ring-left=rgb:l* ring-right=rgb:r*"
