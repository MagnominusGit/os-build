QFORGE_DEVICE_ID=ayaneo-pocket-s2k
QFORGE_DEVICE_NAME='AYANEO Pocket S 2K'
QFORGE_SOC_CLASS=SM8550

QFORGE_PRIMARY_CONNECTOR=DSI-1
QFORGE_PANEL_NATIVE_WIDTH=1440
QFORGE_PANEL_NATIVE_HEIGHT=2560
QFORGE_PANEL_REFRESH_RATES=60
QFORGE_GAMESCOPE_FAKE_OUTPUT_MM=177x100
# Same 1440x2560 panel and over-the-cap scanout rotation as the Pocket S2, so the same 1 ms commit
# lead against late-commit underruns (see ayaneo-pocket-s2.conf for the trace). Not traced on this
# board itself (SM8550, not the S2's SM8650): carried on the S2's evidence, operator's call.
QFORGE_SCANOUT_ROTATION_TIME_US=1000
