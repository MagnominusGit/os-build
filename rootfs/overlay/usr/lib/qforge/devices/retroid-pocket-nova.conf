QFORGE_DEVICE_ID=retroid-pocket-nova
QFORGE_DEVICE_NAME='Retroid Pocket Nova'
QFORGE_SOC_CLASS=SM8550

QFORGE_PRIMARY_CONNECTOR=DSI-1
# Native LANDSCAPE 4:3 panel (4.5", Ilitek IL97680A) — unlike the rest of the fleet
# there is no DTS rotation, so these are already the scanout dimensions.
QFORGE_PANEL_NATIVE_WIDTH=1280
QFORGE_PANEL_NATIVE_HEIGHT=960
QFORGE_PANEL_REFRESH_RATES=60,120
# 4:3, so NOT the fleet's 16:9 177x100: 120x90 keeps the panel aspect exact at
# ~10.7 px/mm on both axes, within ~1% of the fleet's 10.8 declared density. The real
# panel (91x68 mm) makes the UI far too big — see the fake-output-mm note in device-env.
QFORGE_GAMESCOPE_FAKE_OUTPUT_MM=120x90

# Hardware map (hw-map; docs/hardware-map.md has the per-SoC reasoning). Names read off this
# board's DTS and the drivers' naming, cross-checked with ROCKNIX `next`; not yet read off this
# board running QForge, so a wrong one is logged and detected instead.
# Backlight: the il97680a panel's own DCS backlight on mdss_dsi0; the pwm `backlight` node
# inherited from the RP6 DTS drives nothing. LEDs: the RP6's stick rings, inherited.
QFORGE_HW_BATTERY=qcom-battmgr-bat
QFORGE_HW_CHARGER=qcom-battmgr-usb
QFORGE_HW_BACKLIGHT=ae94000.dsi.0
QFORGE_HW_THERMAL_CPU=cpu7-top-thermal
QFORGE_HW_THERMAL_GPU=gpuss-0-thermal
QFORGE_HW_FAN=pwmfan
QFORGE_HW_GPU_DEVFREQ=3d00000.gpu
QFORGE_HW_LED_GROUPS="ring-left=rgb:l* ring-right=rgb:r*"
