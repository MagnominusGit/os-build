# A commit landing under ~0.3 ms before vblank makes the NEXT frame underrun on the DSI encoder: a
# one-frame black blink, in the library and in games. 6/6 underruns traced that way over 51,623
# frames while only 0.7% of frames land that late; pinning the DPU at max clock + bandwidth did not
# change the rate (HW 2026-10-04). A 1 ms floor took a 48,678-frame A/B to zero underruns, at ~1.25 ms
# of extra latency. TRIAL: keep only while the underrun trace stays quiet.
QFORGE_SCANOUT_ROTATION_TIME_US=1000
