# retroforge device-env defaults — sourced first, then overlaid by the matched
# <profile>.conf. An unrecognised board falls through with these values.
RETROFORGE_DEVICE_ID=unknown
RETROFORGE_DEVICE_NAME=unknown
RETROFORGE_SOC_CLASS=

RETROFORGE_PRIMARY_CONNECTOR=
RETROFORGE_PANEL_TYPE=internal
# portrait (every board but one): the panel's native mode is portrait and the device is held
# landscape, so retroforge-session swaps native WIDTHxHEIGHT into the landscape logical canvas.
# landscape (MANGMI Air Y Pro): the panel is landscape-native, no swap, no scanout rotation.
RETROFORGE_PANEL_ORIENTATION=portrait
RETROFORGE_PANEL_NATIVE_WIDTH=
RETROFORGE_PANEL_NATIVE_HEIGHT=
RETROFORGE_PANEL_REFRESH_RATES=
# Second panel of a dual-screen board (empty = single panel). gamescope drives SECONDARY_CONNECTOR
# as its second output (--secondary-output; its mode is read off the connector) and routes
# SECONDARY_TOUCHSCREEN to it (--secondary-touch-device, matched on the input device NAME, which for
# edt-ft5x06 digitizers is the DTS `label` via kernel patch 0705). Read the connector off the
# device, never off another board.
RETROFORGE_SECONDARY_CONNECTOR=
RETROFORGE_SECONDARY_TOUCHSCREEN=
# The UI scale lever (measured with SteamUI; OpenGamepadUI not yet re-measured), and the ONLY one — HW-confirmed on a Thor Lite: halving this doubles the
# reported DPI and the UI grows to match. It is a UI-DENSITY value, not a panel size: the fleet's
# 16:9 boards all declare 177x100 so every board lands at the same ~10.8 px/mm, and a non-16:9 board
# holds the vertical 100mm and derives its width. The panel's real mm (from the DRM connector, and
# now also from the synthesized EDID) do NOT drive scale — the Steam client stopped honouring them
# in 2026-07, which is when this was measured. Empty lets gamescope report the connector's own mm. Aspect-match it to the LANDSCAPE
# logical -W/-H, else the two axes disagree on DPI.
RETROFORGE_GAMESCOPE_FAKE_OUTPUT_MM=
# fake = fake-suspend (real suspend hangs these SoCs); mem = suspend-to-RAM.
RETROFORGE_SUSPEND_MODE=fake

# --- Hardware map (/usr/lib/retroforge/hw-map -> /run/retroforge/hw) ---------------------------------
# Names under /sys/class/{power_supply,backlight,hwmon,devfreq}, thermal zone TYPE names (with
# their -thermal suffix), and LED groups. Every known board pins its own, read off its DTS and the
# drivers' naming (docs/hardware-map.md has the per-board table and where each name comes from).
# Empty = hw-map detects it (first battery that reports a capacity, first charger with `online`,
# first backlight, zone types matching cpu/gpu/battery/skin, first hwmon with a fan, the *gpu*
# devfreq) -- what an unknown board gets, and what a pinned name falls back to when the board
# turns out not to have it. Detection gets known boards wrong (the Thor's bottom-screen backlight
# sorts before the top one; on SM8250 the first cpu zone is cpu0, a little core; the Air Y Pro's
# charge pump sorts before its charger) or right only by sort order (the Thor Lite, RP6 and Nova
# also carry two backlights), hence the pins.
RETROFORGE_HW_BATTERY=
RETROFORGE_HW_CHARGER=
RETROFORGE_HW_BACKLIGHT=
RETROFORGE_HW_THERMAL_CPU=
RETROFORGE_HW_THERMAL_GPU=
RETROFORGE_HW_THERMAL_BATTERY=
RETROFORGE_HW_THERMAL_SKIN=
RETROFORGE_HW_FAN=
RETROFORGE_HW_GPU_DEVFREQ=
# "group=glob[,glob] ..." over /sys/class/leds, e.g. "ring-left=rgb:l* ring-right=rgb:r*"; each
# group becomes /run/retroforge/hw/leds/<group>/01.. in natural order. Empty: "power=power-led" when
# that LED exists (the PM8550 boards), else no groups.
RETROFORGE_HW_LED_GROUPS=

# CPU schedulers retroforge-powerd may offer (space-separated subset of "none lavd"); empty = all.
# A board narrows it where a scheduler measured harmful (see the SM6115 profiles).
RETROFORGE_CPU_SCHEDULERS=

# The fan, for retroforge-powerd ([fan] keys, between its factory config and the operator's /etc):
# the lowest PWM (0-255) the board's fan keeps spinning at, and the temperature (C) below which the
# fan stops instead of idling at that floor (0 = never stops). Empty = power.conf's own values.
RETROFORGE_FAN_MIN_PWM=
RETROFORGE_FAN_OFF_BELOW=

# 1: OpenGamepadUI's own display is its 1280x800 design size at the output's aspect (1422x800 on
# 16:9) and the panel plane scales it to the output, instead of the shell drawing every frame at the
# full output size (Settings > Display > Reduced UI resolution, the RetroForge plugin). For GPUs that
# cannot fill 1920x1080 at 60 fps: on the Air X's Adreno 610 the shell managed 37-39 fps natively
# and 57 at the design size (menu navigation, 2026-10-10). 0: native.
RETROFORGE_UI_VIEWPORT_RENDER=0

# The shell's renderer when it should not be Godot's default (Vulkan): "opengl" for boards short of
# memory, where OpenGL leaves ~130 MiB more RAM to games at the cost of more long frames while
# navigating (docs/perf-sm6115.md). On such a board Settings > Display offers Vulkan instead.
# Empty = Vulkan, with no choice offered.
RETROFORGE_UI_RENDERER=

# The size of the GAME display (gamescope -w/-h: the second Xwayland, where the shell launches games
# and Steam), when it should be smaller than the output. Empty = the output size. The panel plane
# scales the (pre-rotated) frame up in hardware, so this costs no GPU pass; it is for GPUs that
# cannot fill the output at 60 fps.
RETROFORGE_GAMESCOPE_NESTED_W=
RETROFORGE_GAMESCOPE_NESTED_H=
