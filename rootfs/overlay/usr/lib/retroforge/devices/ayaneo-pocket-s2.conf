RETROFORGE_DEVICE_ID=ayaneo-pocket-s2
RETROFORGE_DEVICE_NAME='AYANEO Pocket S2'
RETROFORGE_SOC_CLASS=SM8650

RETROFORGE_PRIMARY_CONNECTOR=DSI-1
RETROFORGE_PANEL_NATIVE_WIDTH=1440
RETROFORGE_PANEL_NATIVE_HEIGHT=2560
RETROFORGE_PANEL_REFRESH_RATES=60
RETROFORGE_GAMESCOPE_FAKE_OUTPUT_MM=177x100

# Hardware map (hw-map; docs/hardware-map.md has the per-SoC reasoning). Names read off this
# board's DTS and the drivers' naming, cross-checked with ROCKNIX `next`; not yet read off this
# board running RetroForge, so a wrong one is logged and detected instead.
# Backlight: the SY7758 LED driver the wt0630-2k panel links. LEDs: the PM8550 power LED. The
# stick RGB rings are the serial MCU's (ROCKNIX writes frames to ttyHS0), with no LED device yet.
# SM8650 names its GPU zones gpuss0..7, without SM8550's hyphen.
RETROFORGE_HW_BATTERY=qcom-battmgr-bat
RETROFORGE_HW_CHARGER=qcom-battmgr-usb
RETROFORGE_HW_BACKLIGHT=sy7758-backlight
RETROFORGE_HW_THERMAL_CPU=cpu7-top-thermal
RETROFORGE_HW_THERMAL_GPU=gpuss0-thermal
RETROFORGE_HW_FAN=pwmfan
RETROFORGE_HW_GPU_DEVFREQ=3d00000.gpu
RETROFORGE_HW_LED_GROUPS="power=power-led"
