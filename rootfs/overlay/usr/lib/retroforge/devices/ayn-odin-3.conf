RETROFORGE_DEVICE_ID=ayn-odin-3
RETROFORGE_DEVICE_NAME='AYN Odin 3'
RETROFORGE_SOC_CLASS=SM8750

RETROFORGE_PRIMARY_CONNECTOR=DSI-1
RETROFORGE_PANEL_NATIVE_WIDTH=1080
RETROFORGE_PANEL_NATIVE_HEIGHT=1920
# icna3520: two fixed modes (60/120); the exact rates are frame-length
# calibrated per device over the panel's sysfs knobs (kernel patch 0533).
RETROFORGE_PANEL_REFRESH_RATES=60,120
RETROFORGE_GAMESCOPE_FAKE_OUTPUT_MM=177x100

# Hardware map (hw-map; docs/hardware-map.md). Read off the board DTS
# (cq8725s-ayn-odin3.dts + cq8725s-ayn-common.dtsi) and sm8750.dtsi; not yet
# read off this board running RetroForge. Battery/charger: pmic-glink battmgr,
# as on SM8550/SM8650. Thermal: SM8750 has no cpuN-top zones; cpu-1-* are the
# prime pair (capacity 1894, patch 1168), gpuss0 as on SM8650. Fan: pwm-fan on
# the pm8550 LPG, no tachometer. Backlight is NOT pinned: the icna35xx panel
# driver registers the DSI dev name (dev_name()), so the only backlight is
# left to detection rather than pinning a register address. LEDs: HTR3212
# stick rings, rgb:l1..l4 / rgb:r1..r4 multicolor groups over 12 channels each.
RETROFORGE_HW_BATTERY=qcom-battmgr-bat
RETROFORGE_HW_CHARGER=qcom-battmgr-usb
RETROFORGE_HW_THERMAL_CPU=cpu-1-0-0-thermal
RETROFORGE_HW_THERMAL_GPU=gpuss0-thermal
RETROFORGE_HW_FAN=pwmfan
RETROFORGE_HW_GPU_DEVFREQ=3d00000.gpu
RETROFORGE_HW_LED_GROUPS="ring-left=rgb:l* ring-right=rgb:r*"
