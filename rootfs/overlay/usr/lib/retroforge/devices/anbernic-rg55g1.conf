RETROFORGE_DEVICE_ID=anbernic-rg55g1
RETROFORGE_DEVICE_NAME='Anbernic RG 55G1'
RETROFORGE_SOC_CLASS=SM4450

# Anbernic RG 55G1 — Snapdragon G1 Gen 2 (SM4450: 2x A78 + 6x A55, Adreno 613), UFS + SD. Read off
# the board DTS (sm4450-anbernic-rg55g1.dts) and the panel driver; not yet read off this board
# running RetroForge.
#
# One DSI link: the FT7131M LCD (kernel patch 0590) on mdss_dsi0 -> card0-DSI-1, 1080x1920
# portrait native with rotation=<90> in the DTS, which gamescope reads off the connector. Its one
# mode is the vendor timing: 145.279 MHz over 1198x1988 = 61.0 Hz, so the rate is 61, not 60.
RETROFORGE_PRIMARY_CONNECTOR=DSI-1
RETROFORGE_PANEL_NATIVE_WIDTH=1080
RETROFORGE_PANEL_NATIVE_HEIGHT=1920
RETROFORGE_PANEL_REFRESH_RATES=61
# 16:9 landscape -> the fleet's 177x100 density value (see defaults.conf). Not yet measured on
# this panel.
RETROFORGE_GAMESCOPE_FAKE_OUTPUT_MM=177x100

# Hardware map (hw-map; docs/hardware-map.md). Battery/charger: pmic-glink battmgr (ROCKNIX's 0054
# rename to "battery" is not carried, so the names are the SM8550 ones). Backlight: the
# pwm-backlight node on the pm6450 LPG, inverted polarity (kernel patch 0691). CPU zone: the board
# DTS defines the zones; cpu6-0/7-0 are the A78 pair, not yet measured which runs hotter. Fan:
# pwm-fan over a GPIO PWM, with a tachometer. LEDs: the status LED is three gpio-leds,
# red/green/blue:indicator, which powerd drives as one colour; the stick RGB lights are the
# singleadc-joypad's own sysfs attributes (0763), not LED class devices, so hw-map does not see them.
RETROFORGE_HW_BATTERY=qcom-battmgr-bat
RETROFORGE_HW_CHARGER=qcom-battmgr-usb
RETROFORGE_HW_BACKLIGHT=backlight
RETROFORGE_HW_THERMAL_CPU=cpu6-0-thermal
RETROFORGE_HW_THERMAL_GPU=gpu-thermal
RETROFORGE_HW_FAN=pwmfan
RETROFORGE_HW_GPU_DEVFREQ=3d00000.gpu
RETROFORGE_HW_LED_GROUPS="power=*:indicator"
