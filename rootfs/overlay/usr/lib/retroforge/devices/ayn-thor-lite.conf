RETROFORGE_DEVICE_ID=ayn-thor-lite
RETROFORGE_DEVICE_NAME='AYN Thor Lite'
RETROFORGE_SOC_CLASS=SM8250

# The only SM8250 board with TWO live DSI links: the primary chipone,icna3520 on
# mdss_dsi0 (dsi_p_* pinctrl) and a secondary ch13726a,thor on mdss_dsi1.
#
# HW-CONFIRMED 2026-08-10 by reading /sys/class/drm on the device:
#   card0-DSI-1  connected  1080x1920   <- icna3520, mdss_dsi0   (this one)
#   card0-DSI-2  connected  1080x1240   <- ch13726a,thor, mdss_dsi1
# The geometry is what tells them apart, unambiguously: 1080x1240 is rpminiv2_display_mode,
# which the ch13726a driver's of_match points "ch13726a,thor" at.
#
# This value is NOT DERIVABLE — read it off the device, never off another board. It was
# DSI-2 first, reasoned from the SM8550 AYN Thor, which has the identical shape (primary
# on mdss_dsi0, second panel on mdss_dsi1) and really is DSI-2 (7c6850c, itself a fix).
# Same layout, different index. gamescope took --prefer-output DSI-2, lit the small
# secondary panel, and the main screen stayed black while the boot console still showed.
RETROFORGE_PRIMARY_CONNECTOR=DSI-1
RETROFORGE_PANEL_NATIVE_WIDTH=1080
RETROFORGE_PANEL_NATIVE_HEIGHT=1920
RETROFORGE_PANEL_REFRESH_RATES=60,120
RETROFORGE_GAMESCOPE_FAKE_OUTPUT_MM=177x100

# The bottom panel (ch13726a,thor on mdss_dsi1), the second connector in the HW read above.
# Touch: the FocalTech ft5452 on i2c0 is labelled "bottom_touchscreen" in sm8250-ayn-thorlite.dts,
# and patch 0705 makes that label its input device name (the top one, ft5426 on i2c13, is
# "top_touchscreen"). Native mode 1080x1240 @ 60 Hz (read by gamescope off the connector). Its backlight registers as ae96000.dsi.0 (the panel driver names it after
# the DSI device); not carried until something needs it by name.
# HW-CONFIRMED 2026-10-10 on the device: /sys/class/input event2 "bottom_touchscreen", event3
# "top_touchscreen"; /sys/class/backlight ae94000.dsi.0 + ae96000.dsi.0; DSI-2 connected 1080x1240.
RETROFORGE_SECONDARY_CONNECTOR=DSI-2
RETROFORGE_SECONDARY_TOUCHSCREEN=bottom_touchscreen

# Hardware map (hw-map; docs/hardware-map.md has the per-SoC reasoning). Names read off this
# board's DTS and the drivers' naming, cross-checked with ROCKNIX `next`. Only the backlights
# have been read off this board running RetroForge (the HW read above); for the rest, a wrong one
# is logged and detected instead.
# Backlight: two panels, each with its own DCS backlight named after its DSI device; the primary
# icna3520 is on mdss_dsi0 (ae94000.dsi.0), the secondary ch13726a on mdss_dsi1 (ae96000.dsi.0).
# HW-CONFIRMED 2026-10-10 (/sys/class/backlight, see above).
# LEDs: the stick rings, four RGB segments a side (leds-group-multicolor over two HTR3212s;
# multi_index reads blue green red).
RETROFORGE_HW_BATTERY=battery
RETROFORGE_HW_CHARGER=pm8150b-charger
RETROFORGE_HW_BACKLIGHT=ae94000.dsi.0
RETROFORGE_HW_THERMAL_CPU=cpu7-top-thermal
RETROFORGE_HW_THERMAL_GPU=gpu-top-thermal
RETROFORGE_HW_THERMAL_SKIN=skin-msm-thermal
RETROFORGE_HW_FAN=pwmfan
RETROFORGE_HW_GPU_DEVFREQ=3d00000.gpu
RETROFORGE_HW_LED_GROUPS="ring-left=rgb:l* ring-right=rgb:r*"
