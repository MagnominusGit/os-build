RETROFORGE_DEVICE_ID=konkr-pocket-fit-elite
RETROFORGE_DEVICE_NAME='KONKR Pocket FIT Elite'
RETROFORGE_SOC_CLASS=SM8750

RETROFORGE_PRIMARY_CONNECTOR=DSI-1
RETROFORGE_PANEL_NATIVE_WIDTH=1080
RETROFORGE_PANEL_NATIVE_HEIGHT=1920
RETROFORGE_PANEL_REFRESH_RATES=60,90,120,144
RETROFORGE_GAMESCOPE_FAKE_OUTPUT_MM=177x100

# Hardware map (hw-map; docs/hardware-map.md). Read off the board DTS
# (sm8750-konkr-pf-elite.dts) and sm8750.dtsi; not yet read off this board
# running RetroForge. Battery/charger: pmic-glink battmgr, as on SM8550/
# SM8650. Thermal: cpu-1-* are the prime pair (capacity 1894, patch 1168),
# gpuss0 as on SM8650. Fan: pwm-fan on the pm8550 LPG with a tachometer
# (TLMM67). Backlight: AW99706 ("aw99706-backlight"). No LED groups: the
# konkr_sysbtn RGB half is stripped (kernel patch 0765), so the stick ring
# has no LED surface.
RETROFORGE_HW_BATTERY=qcom-battmgr-bat
RETROFORGE_HW_CHARGER=qcom-battmgr-usb
RETROFORGE_HW_BACKLIGHT=aw99706-backlight
RETROFORGE_HW_THERMAL_CPU=cpu-1-0-0-thermal
RETROFORGE_HW_THERMAL_GPU=gpuss0-thermal
RETROFORGE_HW_FAN=pwmfan
RETROFORGE_HW_GPU_DEVFREQ=3d00000.gpu
