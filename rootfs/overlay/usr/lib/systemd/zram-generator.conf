# retroforge zram swap — a compressed swap device in RAM, sized at physical memory, up to 8 GB.
#
# WHY: this device had no swap at all, on a target that spans 8 GB SKUs and runs emulators (JIT
# caches, shader caches — memory-hungry). Without swap the kernel's only reclaim option for anonymous pages is to OOM, so
# every allocation spike had to be paid for by killing something.
#
# It also completes a tuning knob that was already shipped but inert: 60-retroforge-gaming.conf sets
# vm.swappiness=180, which is meaningless without a swap device and is exactly right WITH a zram one
# (a high swappiness tells the kernel that swapping to zram is cheaper than dropping page cache,
# which for RAM-backed compressed swap it genuinely is).
#
# NO DISK IS INVOLVED — this is RAM compressed in RAM. That is what makes it acceptable here: the
# root is read-only, /var is a 256 MB partition, and the only writable bulk storage is an SD card
# where a swap file would be both slow and a wear problem.
#
# lz4 first, zstd for what then sits idle. A page is compressed with lz4 as it is swapped out, and
# retroforge-zram-recompress.timer recompresses the pages nothing has touched since its last run
# with zstd (the second algorithm: zram's recompression, CONFIG_ZRAM_MULTI_COMP). Per 4 KiB page of
# real swap on the Air X (2026-10-23): lz4 361/199 MB/s compress and 1836/1093 MB/s decompress
# (A73/A53) at a 1.59 ratio; zstd level 1 108/61 and 378/242 at 1.79, the same ratio as level 3
# (1.80) for a quarter more speed. So the pages a game keeps coming back to fault in at lz4 speed,
# and the cold ones end at zstd's ratio. Note the accounting: the device is sized at RAM but only
# consumes the memory actually needed to store what has been swapped into it, compressed.
#
# swap-priority is set explicitly so that if a real swap device is ever added (the install-to-UFS
# work), zram is preferred over it rather than the order being whatever systemd happened to mount
# first.
#
# REQUIRES A KERNEL WITH ZRAM. CONFIG_ZRAM, CONFIG_ZRAM_BACKEND_LZ4, CONFIG_ZRAM_BACKEND_ZSTD and
# CONFIG_ZRAM_MULTI_COMP are in kernel/kernel.config; kernel/build.sh asserts they survived
# olddefconfig, because the failure mode is otherwise silent (no zram0, no swap, no error, and a
# swappiness of 180 doing nothing).
#
# zswap is NOT disabled here, unlike the reference platform's version of this config: our kernel has
# CONFIG_ZSWAP off entirely, so there is nothing to turn off and a tmpfiles line poking at
# /sys/module/zswap/parameters/enabled would be writing to a path that does not exist.

[zram0]
# As much as RAM, up to 8 GB (Fedora's default). zram only uses memory for what it holds, ~3:1
# compressed; at ram/2 Hades filled it on the 3.5 GB Air X with RAM to spare.
zram-size = min(ram, 8192)
compression-algorithm = lz4 zstd(level=1)
swap-priority = 100
fs-type = swap
