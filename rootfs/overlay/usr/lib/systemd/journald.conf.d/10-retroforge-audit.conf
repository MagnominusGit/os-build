# Kernel auditing stays off, but initialized.
#
# journald's Audit= defaults to yes and switches auditing on at start, after which every process
# takes the audited syscall path and kmsg fills with records nothing reads (auditd ships disabled).
# `no` has journald switch it off instead.
#
# This replaced audit=0 on the kernel command line, which did the same by never initializing the
# subsystem, and so never registered its netlink socket. Every audit record PAM (each login, the
# session's own included), sshd and dbus-broker then tried to send made the kernel exec modprobe for
# net-pf-16-proto-9 and wait for it, ~7 ms each (Air X, 2026-10-31).
[Journal]
Audit=no
