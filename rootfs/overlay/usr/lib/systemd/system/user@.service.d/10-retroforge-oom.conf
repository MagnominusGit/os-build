# retroforge: the player's user manager at the session's OOM tier, so the session spine it runs
# (pipewire, pipewire-pulse, wireplumber, the session bus) can be there too.
#
# Both OOM killers rank by oom_score_adj before size: the kernel adds adj/1000 of RAM+swap to a
# process's pages, and earlyoom starts from the same oom_score. A game starts at 900 (Steam's launch
# wrapper, retroforge-steam-direct, the store tool, retroforge-launch); the session
# (retroforge-session.service: gamescope, OGUI) runs at 0.
#
# systemd's user@.service sets 100, and a user manager gives its services its own value + 100
# (DefaultOOMScoreAdjust), so the spine ran at 200: ~1.4 GB of badness on the Air X (3.5 GB RAM +
# 3.5 GB zram), about what GRIP itself held at 0. The kernel killed the spine, and the session with
# it, while the game lived (2026-10-24).
#
# A manager without CAP_SYS_RESOURCE cannot set a service below its own value (the kernel keeps the
# value root set as the floor, and systemd skips the EACCES silently), so the spine's 0 needs the
# manager at 0. The spine's own drop-ins are usr/lib/systemd/user/<unit>.service.d/10-retroforge-oom.conf.
# Every other user service gets 100, still ahead of the session.
[Service]
OOMScoreAdjust=0
