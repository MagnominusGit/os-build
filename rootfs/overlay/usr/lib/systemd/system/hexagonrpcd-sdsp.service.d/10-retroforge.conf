# retroforge: as hexagonrpcd-adsp-sensorspd.service.d, for boards whose sensors run on an SLPI.
[Unit]
Wants=msm-firmware-loader-hexagonrpc.service
After=msm-firmware-loader-hexagonrpc.service
ConditionPathExists=/run/msm-firmware-loader/hexagonrpc/sensors/registry
StartLimitIntervalSec=60
StartLimitBurst=5

[Service]
ExecStart=
ExecStart=/usr/bin/hexagonrpcd -f /dev/fastrpc-sdsp -d sdsp -s -R /run/msm-firmware-loader/hexagonrpc
