# Replaces systemd's user@.service.d/10-login-barrier.conf for the session user, as systemd's own
# user@0.service.d/10-login-barrier.conf does for root: an instance drop-in masks the template's
# drop-in of the same name.
#
# That one orders every user manager after systemd-user-sessions.service, which waits for
# network.target, and the session's login waits for its user manager (pam_systemd). So the session
# waited for NetworkManager after all: player's manager started 0.55 s after the session, as the
# network came up (Air X, 2026-11-01). retroforge-allow-login is the same barrier without the
# network. The manager's own PAM stack checks pam_nologin too, so it pulls that unit in itself:
# with linger (tmpfiles.d/retroforge-linger.conf) logind starts it whether or not the session does.
[Unit]
Wants=retroforge-allow-login.service
After=retroforge-allow-login.service
