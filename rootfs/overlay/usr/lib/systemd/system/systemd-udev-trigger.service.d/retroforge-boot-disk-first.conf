# The boot disk's uevents go into the queue ahead of the coldplug replay.
#
# /home, /esp and the slots' device units wait for udev to finish the boot disk's partitions, and the
# session waits for /home. Queued with everything else, a partition is not started until its disk's
# event is done and then shares the workers with the internal storage's own partitions (85 on the
# Air X): the card's last one was done 1.3 s after udevd was ready (2026-11-01). The replay adds them
# again afterwards, which only repeats their rules.
[Service]
ExecStartPre=-/usr/lib/retroforge/trigger-boot-disk
