# retroforge: serve the tree msm-firmware-loader builds from this board's own partitions, and only
# where its persist has a sensors registry, which is what the sensors PD reads. A DSP without a
# sensors PD fails the attach every time; stop after five tries instead of retrying every 3 s.
[Unit]
Wants=msm-firmware-loader-hexagonrpc.service
After=msm-firmware-loader-hexagonrpc.service
ConditionPathExists=/run/msm-firmware-loader/hexagonrpc/sensors/registry
StartLimitIntervalSec=60
StartLimitBurst=5

[Service]
ExecStart=
ExecStart=/usr/bin/hexagonrpcd -f /dev/fastrpc-adsp -d adsp -s -R /run/msm-firmware-loader/hexagonrpc
