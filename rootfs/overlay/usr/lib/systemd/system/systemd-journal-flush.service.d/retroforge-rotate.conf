# Start each boot's persistent journal in a fresh file.
#
# The boot's flush (this unit's start) is on the path to the session: sysinit.target waits for it
# through systemd-tmpfiles-setup. Appending to the last boot's system.journal on a cold page cache
# makes every lookup in its 64M of hash tables a random read off the card: 614 ms for ~800 entries
# on the Air X, against 19 ms into a fresh file (2026-10-31). Rotating as the unit stops at shutdown,
# while /var/log is still the persistent journal, leaves the next boot a fresh one. An unclean
# shutdown needs nothing here: journald replaces a file it finds dirty.
#
# ExecStop= is reset because the rotation must come before the stock relinquish, not after it.
[Service]
ExecStop=
ExecStop=journalctl --rotate
ExecStop=journalctl --smart-relinquish-var
