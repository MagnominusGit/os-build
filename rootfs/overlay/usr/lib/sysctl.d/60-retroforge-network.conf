# Network sysctl tuning. Overrides the base 10-arch.conf / 50-default.conf drop-ins (higher prefix
# wins).

# Packetization-layer path MTU discovery (RFC 4821) when full-size packets vanish. Seen on the Pocket
# ACE over Wi-Fi (2026-10-17): in bursts, a new connection's first full-size data packet (a TLS
# hello) was retransmitted and never acknowledged while small packets passed, so the connection
# timed out (ScreenScraper, GitHub). With 1 the kernel, once such a connection has timed out
# retransmitting, retries with tcp_base_mss-sized segments (1024 bytes by default) and grows them
# again when they get through; a healthy path never triggers it (20 uploads on the ACE: no probe).
# Not 2 (probe always), which would start every connection small.
net.ipv4.tcp_mtu_probing=1
