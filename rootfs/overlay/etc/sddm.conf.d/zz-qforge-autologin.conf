# qforge: boot straight into the gamescope shell as the unprivileged session user. SDDM logs it in
# through
# PAM (pam_systemd → a real ACTIVE seat0 logind session), then launches the `qforge` wayland
# session (/usr/share/wayland-sessions/qforge.desktop → /usr/bin/qforge-session). That active
# session is what lets stock polkit authorize Wi-Fi (allow_active) and timezone (subject.active &&
# wheel) — replacing the old "no-active" bypass rule.
#
# Relogin=true: if the shell exits (gamescope crash / shell restart), re-run autologin instead
# of dropping to the greeter — an appliance never shows a login screen. (The interactive greeter is
# never started, so no greeter display-server / weston is needed.)
[Autologin]
User=player
Session=qforge
Relogin=true

[General]
DisplayServer=wayland
