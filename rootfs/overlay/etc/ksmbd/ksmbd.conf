; RetroForge network shares: the player's ROMs, BIOS, saves and save states (the layout in
; /usr/share/user-tmpfiles.d/retroforge-home.conf), served by ksmbd, the in-kernel SMB3 server.
;
; Decided 2026-10-03: ON by default, GUEST read-write, no password -- anyone on the same network
; can read and write these four folders. Not the rest of the home (emulators, settings, dotfiles).
; Every guest is mapped to the player user, so files copied in are owned by player and readable by
; the emulators.
;
; Clients: Linux, macOS and Android file managers connect as guest out of the box
; (smb://retroforge.local, announced over mDNS by /etc/avahi/services/smb.service). Windows 10/11
; refuse SMB guest logins by default (insecure guest auth off; 24H2 also requires signing).
[global]
	netbios name = RETROFORGE
	server string = RetroForge
	map to guest = bad user
	guest account = player
	create mask = 0644
	directory mask = 0755

; ksmbd-tools adds [ipc$] itself, without guest ok, so a guest could not even list the shares.
[ipc$]
	guest ok = yes

[roms]
	comment = ROMs, one folder per system
	path = /home/player/roms
	guest ok = yes
	read only = no

[bios]
	comment = BIOS files
	path = /home/player/bios
	guest ok = yes
	read only = no

[saves]
	comment = Memory cards and saves, one folder per system
	path = /home/player/saves
	guest ok = yes
	read only = no

[states]
	comment = Save states, one folder per system
	path = /home/player/states
	guest ok = yes
	read only = no
