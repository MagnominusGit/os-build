# System -> emulator for retroforge-launch (one `<system>=<emulator>` per line; the last match wins).
# <system> is the ROM folder name under /home/player/roms and the first argument of every ROM card;
# <emulator> names /usr/share/retroforge/emulators/<emulator>/emulator.json (how to run it) and
# /home/player/emulators/<emulator>/ (the downloaded version).
