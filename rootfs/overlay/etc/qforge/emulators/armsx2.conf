# ARMSX2 (PlayStation 2), sourced by qforge-launch (bash).
# BINARY: path inside the AppImage. Not AppRun, see qforge-launch.
# ARGS: before the ROM path. -batch quits when the game closes, so OGUI gets the panel back; -nogui
# keeps the desktop main window from opening behind the game; -- ends options in case a ROM name
# starts with '-'.
# GUI_ARGS: for `qforge-launch --gui armsx2` (no ROM). Big Picture is the pad-driven UI; no -batch,
# which would quit at once with no game to run.
# SEED: <file in /usr/share/qforge/emulators/armsx2>:<path under $HOME>, copied on the first launch
# only (never over an existing file). ARMSX2 keeps its settings in ~/.config/ARMSX2/inis/PCSX2.ini.
BINARY=usr/bin/armsx2-qt
ARGS=(-batch -nogui -fullscreen --)
GUI_ARGS=(-bigpicture -fullscreen)
SEED=(PCSX2.ini:.config/ARMSX2/inis/PCSX2.ini)
