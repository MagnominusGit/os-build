# DuckStation (PlayStation), sourced by qforge-launch (bash).
# BINARY: path inside the AppImage. Not AppRun, see qforge-launch.
# ARGS: before the ROM path. -batch quits when the game closes, so OGUI gets the panel back instead
# of DuckStation's own UI; -- ends options in case a ROM name starts with '-'.
BINARY=usr/bin/duckstation-qt
ARGS=(-batch -fullscreen --)
