# System -> emulator for qforge-launch (one `<system>=<emulator>` per line; the last match wins).
# <system> is the ROM folder name under /home/player/roms and the first argument of every ROM card;
# <emulator> names /etc/qforge/emulators/<emulator>.conf and /home/player/emulators/<emulator>/.
psx=duckstation
ps2=armsx2
