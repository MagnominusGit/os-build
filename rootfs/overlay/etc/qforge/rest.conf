# qforge-rest — rest-mode ("fake suspend") config. Single override point for /usr/bin/qforge-rest.
# All keys are optional; the launcher applies the defaults shown below if unset.

# cpufreq governor applied to every policy on enter (restored to the per-policy previous governor on
# leave). Must be advertised in the policy's scaling_available_governors or that policy is left alone.
#QFORGE_REST_GOVERNOR=powersave

# GPU devfreq governor applied on enter (restored to the previous one on leave). Must be advertised
# in the GPU's devfreq available_governors. The GPU node is found SoC-independently by its ".gpu"
# devfreq name suffix (gpu@<addr> -> "<addr>.gpu"), so no per-SoC address is hardcoded.
#QFORGE_REST_GPU_GOVERNOR=powersave

# Which gamescope screen to blank: drm_sleep_<internal|external>_screen. The internal panel is the
# handheld display; "external" is for a docked monitor.
#QFORGE_REST_SCREEN=internal

# Space-separated ops to skip (handy for bring-up / boards missing a knob): panel cpu rfkill governor gpugov.
# e.g. QFORGE_REST_SKIP="panel" to test the power ops over SSH with no gamescope session running.
#QFORGE_REST_SKIP=

# Where gamescope's control socket lives, and its name. Normally LEAVE BOTH UNSET: the panel path
# finds the process holding a /run/user/<uid>/gamescope-N.lock open (gs_resolve_display) and uses
# that directory and slot, which is correct for the `player` session and when gamescope lands on
# gamescope-1+ after a stale socket. To force a socket, set BOTH; one alone is ignored.
#XDG_RUNTIME_DIR=/run/user/1000
#GAMESCOPE_WAYLAND_DISPLAY=gamescope-0

# --- power-key / suspend (qforge-powerbuttond dispatcher + qforge-suspend engine) ---------------
# Power key: qforge-powerbuttond runs QFORGE_POWER_SHORT_CMD on a tap and QFORGE_POWER_LONG_CMD on
# a hold. The default short action is a logind Suspend(), which lands in qforge-suspend.
#QFORGE_WAKE_KEY=KEY_POWER
#QFORGE_WAKE_DEBOUNCE=2          # seconds the dispatcher ignores repeat presses after one fires
#QFORGE_POWER_SHORT_CMD="systemctl suspend"
#QFORGE_POWER_LONG_CMD="systemctl poweroff"

# Dispatcher hold threshold (ms): hold >= this runs the long action; a shorter tap runs the short
# action. 0 = always short.
#QFORGE_WAKE_LONGPRESS_MS=1000

# cgroups frozen on suspend (space-separated; each entry is globbed at use, so wildcards work).
# The default is the player's LOGIN SCOPE, not all of user.slice: everything we want halted lives in
# session-<n>.scope (gamescope, both Xwaylands, the session scripts, mangoapp, the shell and
# the game), while the user session bus and `systemd --user` are SIBLINGS of it under
# user@1000.service and stay answerable. Freezing all of user.slice took those down too, which is why
# `systemctl --user` used to hang inside the frozen window (and why SSH went dead rather than merely
# quiet). Keep the GLOB — the scope number is assigned per login and is not stable across a session
# restart. The engine itself, journald, dbus and logind are in system.slice and are never frozen.
# NB gamescope IS deliberately inside the frozen set (it holds the blank KMS modeset statically), so
# `gamescopectl` is still unreachable while frozen — blank BEFORE the freeze.
#QFORGE_SUSPEND_FREEZE_CGROUPS="/sys/fs/cgroup/user.slice/user-1000.slice/session-*.scope"

# Wake debounce (ms): qforge-suspend ignores a KEY_POWER within this of arming its grabbed wake wait
# (so the tail of the press that triggered the suspend does not immediately wake it).
#QFORGE_WAKE_DEBOUNCE_MS=1000

# Power ops qforge-suspend skips when it lowers power after the freeze (same shared primitives as
# qforge-rest, same keys): cpu rfkill governor gpugov. Empty = apply all. Over SSH on a no-UART
# board, set "rfkill" to keep the link up while testing the freeze/thaw path (the freeze itself drops
# SSH since sshd is in the frozen set, but skipping rfkill avoids soft-blocking wlan on top).
#QFORGE_SUSPEND_SKIP=
