# yaml-language-server: $schema=https://raw.githubusercontent.com/ShadowBlip/InputPlumber/main/rootfs/usr/share/inputplumber/schema/capability_map_v2.json
#
# The Anbernic RG 55G1's two keys beside the screen. The pad is the singleadc-joypad (kernel/
# patches/0762), GPIO buttons plus the stick MCU on spi3, and it already reports standard
# BTN_SOUTH/EAST/WEST/NORTH and ABS_HAT0X/Y, so only these two need claiming. The stock devicetree
# has no BTN_MODE: the keys are gpio34 KEY_F10 and gpio28 KEY_BACK, which Android's keylayout leaves
# as F10 and Back.
#
# F10 is Guide, as in ROCKNIX's anbernic_rg55g1 map. ROCKNIX sends Back to keyboard F1; here it is
# QuickAccess, as on every rsinput board, because nothing in our composites has a keyboard target.
version: 2
kind: CapabilityMap
name: Anbernic RG 55G1 Keys
id: sm4450_rg55g1_keys

mapping:
  - name: Guide Button
    source_events:
      - evdev:
          event_type: KEY
          event_code: KEY_F10
          value_type: button
    target_event:
      gamepad:
        button: Guide
  - name: Back Key
    source_events:
      - evdev:
          event_type: KEY
          event_code: KEY_BACK
          value_type: button
    target_event:
      gamepad:
        button: QuickAccess
filtered_events: []
