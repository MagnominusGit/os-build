# DHCP often fails on the first attempt; shorten the timeout so NM retries faster
# rather than stalling network-online.target (and the queued session) on boot.
# This is a global connection default, not a pre-seeded profile — the shell still owns
# first-boot Wi-Fi selection; NM runs on every build (see rootfs/customize-base.sh).
[connection]
ipv4.dhcp-timeout=10
